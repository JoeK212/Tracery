const HELP_TOPICS=[
{id:'pipeline',t:'From a few numbers to a window',
s:`<p>TRACERY turns your settings into shapes. It first draws the outline of the opening, the hole in the wall. Then it draws a set of <b>cells</b>, the spaces where glass will go. Every cell is shrunk a little all the way around, so a strip of stone is left between neighbours. Whatever is left inside the cells is glass, and the rest is stone.</p><p>The 2D view shows those shapes flat. The 3D view pushes them out into thickness.</p>`,
d:`<p>The steps are: build the head curve and close it into the <b>opening</b>; ask the chosen pattern for its <b>cells</b>, drawn on the centre lines of the bars; shrink each cell by half the bar width; clip the result to the opening shrunk by the frame width. Those are the <b>lights</b>. The tracery is the opening minus the lights, and the wall surround is the wall rectangle minus the opening.</p><p>Everything is a polygon. Curves are held as short straight segments.</p>`,
p:`<p>Opening O is a polygon with arcs sampled at Δθ = 0.07 rad (about 4°). Coordinates are millimetres, scaled ×100 to integers for Clipper (0.01 mm resolution).</p><p><code>L = ( ⋃ᵢ offset(Cᵢ, −w/2) ) ∩ offset(O, −max(f, w/2))</code>, <code>T = O \\ L</code>, <code>surround = R \\ O</code></p><p>Booleans use Clipper with NonZero fill. Offsets use round joins with 0.1 mm arc tolerance. Clipper's PolyTree recovers which contours are holes, so extrusion keeps islands and voids correct.</p>`,
live:()=>`This window: ${G.nLights} light${G.nLights===1?'':'s'}, glazing ratio ${(G.glaze*100).toFixed(1)}%, bar ${fmtLen(S.bar)}, frame ${fmtLen(G.fEff)}.`},

{id:'arch-round',t:'Round and segmental arches',
s:`<p>A round arch is half a circle sitting on top of the opening. A segmental arch is only a slice of a much bigger circle, so it is flatter.</p>`,
d:`<p>On a round arch the circle is centred on the <b>springing line</b>, where the straight sides end. Its radius is half the span, so the rise is also half the span. For a segmental arch you choose a smaller rise. The flatter you go, the larger the circle becomes. <i>Rise ÷ span</i> in the analysis strip is 0.5 for a round arch and lower for anything flatter.</p>`,
p:`<p>For half-span h and rise r: <code>R = (h² + r²) / (2r)</code>, centre at (0, r − R), below the springing line. The arc runs from atan2(−c_y, −h) to atan2(−c_y, h). Rise is clamped to [0.02h, 0.999h]. At r = h, R = h and the arc is a semicircle.</p>`,
live:()=>S.arch==='round'?`Radius = half the span = ${fmtLen(S.span/2)}.`:S.arch==='segmental'?`Rise ${fmtLen(G.op.rise)} on span ${fmtLen(S.span)} gives R = ${fmtLen(G.op.info.radii[0])}, centred ${fmtLen(G.op.info.radii[0]-G.op.rise)} below the springing line.`:'Choose the Round or Segmental head to see your numbers here.'},

{id:'arch-pointed',t:'Pointed arches: drop, equilateral, lancet',
s:`<p>A pointed arch is two circle arcs leaning together and meeting in a point. Draw the circles bigger and the arch grows tall and sharp. Draw them smaller and it is squat. The special case in between, where each circle is as wide as the opening, is called equilateral.</p>`,
d:`<p>One control does the work: <b>Radius ÷ span</b> (ρ). At 0.5 both centres sit in the middle and you get a semicircle. At 1.0 each arc is struck from the opposite springing point, so the two springing points and the apex form an equilateral triangle, and the curves meet at 120°. Above 1.0 you get lancets. Below 1.0 you get drop arches.</p>`,
p:`<p>R = ρ·s with s = 2h. Left arc centre at (R − h, 0). The apex lies on x = 0:</p><p><code>y_a = √(R² − (R − h)²) = √(2Rh − h²)</code></p><p>With θ_a = atan2(y_a, h − R), the interior angle between tangents at the apex is 2π − 2θ_a. For ρ = 1, y_a = h√3 = 0.866 s and the apex angle is 120°. ρ is clamped to ≥ 0.5.</p>`,
live:()=>S.arch==='pointed'?`Span ${fmtLen(S.span)} × ρ ${S.rho.toFixed(2)} gives R = ${fmtLen(G.op.info.radii[0])}. Each arc's centre lies ${fmtLen(G.op.info.radii[0]-S.span/2)} past the centreline. Apex rise ${fmtLen(G.op.rise)}, apex angle ${G.op.info.apex.toFixed(1)}°.`:'Choose the Pointed head to see your numbers here.'},

{id:'arch-horseshoe',t:'Horseshoe arch',
s:`<p>Lift the centre of a circle above the springing line and the curve swings out past the sides of the opening before tucking back in at the bottom, like a horseshoe.</p>`,
d:`<p>The <b>Centre lift</b> control raises the circle's centre. At zero you get a semicircle. The more you lift it, the more of the circle is used, and the stronger the narrowing at the base. The 3D surround is widened to contain the bulge.</p>`,
p:`<p>Centre (0, k), radius <code>r = √(h² + k²)</code>, so the circle passes through the springing points (±h, 0). Arc sweep is <code>π + 2·atan(k/h)</code>. Maximum width is 2r, greater than the span.</p>`,
live:()=>S.arch==='horseshoe'?`Centre lifted ${fmtLen(S.stilt*S.span/2)}, radius ${fmtLen(G.op.info.radii[0])}, ${G.op.info.extra}.`:'Choose the Horseshoe head to see your numbers here.'},

{id:'arch-tudor',t:'Four-centred (Tudor) arch',
s:`<p>This arch uses four arcs: two small tight ones at the corners and two big flat ones that meet in a slight point at the top. It makes a low, wide arch.</p>`,
d:`<p>Three controls: <b>Rise ÷ span</b>, <b>Corner radius ÷ span</b> and <b>Junction angle</b>. The corner arcs are struck from the springing line and sweep up to the junction angle. There the big arc takes over smoothly, with no kink. The big arc's centre is below the springing line. If the three values cannot make a valid curve the tool shows an equilateral arch and tells you.</p>`,
p:`<p>Right side: small centre P = (h − r₁, 0), u = (cos φ, sin φ), apex A = (0, rise), D = A − P. The large arc is internally tangent at the junction, so its centre is C = P − t·u with radius r₂ = t + r₁. Putting A on the large circle gives:</p><p><code>t = (r₁² − |D|²) / (2(D·u − r₁))</code></p><p>Valid when t &gt; 0 and the angle of A from C exceeds φ. The left half is the mirror image.</p>`,
live:()=>S.arch==='tudor'?(G.warn?G.warn:`Corner radius ${fmtLen(G.op.info.radii[0])}, large radius ${fmtLen(G.op.info.radii[1])}, rise ${fmtLen(G.op.rise)}.`):'Choose the Four-centred head to see your numbers here.'},

{id:'arch-ogee',t:'Ogee arch',
s:`<p>An ogee is an S-shaped curve on each side. It bulges outward near the bottom, curves back in near the top, and the two sides meet in a sharp tip.</p>`,
d:`<p>Same controls as the four-centred arch. The lower part is a convex arc with its centre inside the opening. At the junction angle it flips to a concave arc whose centre is outside, and that runs up to the tip. It needs a tall rise and a fairly steep junction angle. When the values cannot make an S the tool falls back to an equilateral arch and says so.</p>`,
p:`<p>Convex arc: centre P = (h − r₁, 0), from angle 0 to φ. Concave arc: centre C = P + s·u with r₂ = s − r₁ (external tangency). Apex on the concave circle gives:</p><p><code>s = (r₁² − |D|²) / (2(r₁ − D·u))</code></p><p>Valid when s &gt; r₁. The concave arc runs from angle φ + π to atan2(A − C) by the shortest signed difference.</p>`,
live:()=>S.arch==='ogee'?(G.warn?G.warn:`Convex radius ${fmtLen(G.op.info.radii[0])}, concave radius ${fmtLen(G.op.info.radii[1])}, rise ${fmtLen(G.op.rise)}.`):'Choose the Ogee head to see your numbers here.'},

{id:'arch-multifoil',t:'Multifoil and cusped arches',
s:`<p>Take a plain arch, mark equal steps along it, and draw a small arc between each pair of marks bulging outward. The sharp points where two small arcs meet are called cusps, and they point inward.</p>`,
d:`<p><b>Radius ÷ span</b> sets the plain arch underneath (0.5 round, 1.0 pointed). <b>Lobes</b> is how many scallops. <b>Lobe depth</b> of 1.0 makes each lobe a semicircle on its chord. Lower values give shallow scallops, higher give more than a semicircle. Three lobes give a trefoil arch. Five to nine give the scalloped arches of Islamic architecture.</p>`,
p:`<p>The base curve is resampled at N + 1 points equal in arc length. For a chord of half-length c and depth b, the sagitta is σ = b·c:</p><p><code>r = (c² + σ²) / (2σ)</code>, centre = midpoint − (r − σ)·n̂</p><p>where n̂ is the outward normal. Each lobe sweeps 4·atan(b). Arcs are struck clockwise from left to right.</p>`,
live:()=>S.arch==='multifoil'?`${Math.round(S.lobes)} lobes at depth ${S.bulge.toFixed(2)}: each lobe sweeps ${(4*Math.atan(S.bulge)*180/Math.PI).toFixed(0)}°.`:'Choose the Multifoil head to see your numbers here.'},

{id:'arch-curves',t:'Elliptical, parabolic, catenary and flat heads',
s:`<p>These heads are not made from circle arcs. They are smooth curves defined by equations. A catenary is the shape of a hanging chain turned upside down. It carries its own weight in pure compression, which is why Gaudí used it.</p>`,
d:`<p>A <b>semi-ellipse</b> is tight at the springings and flat across the crown when the rise is less than half the span. A <b>parabola</b> is more pointed at the crown. A <b>catenary</b> gets more peaked as the rise increases. A <b>flat lintel</b> has no curve at all.</p>`,
p:`<p>Ellipse: x = h cos θ, y = r sin θ. Parabola: <code>y = r(1 − x²/h²)</code>. Catenary: <code>y = r − a(cosh(x/a) − 1)</code>, with a found by bisection from r = a(cosh(h/a) − 1).</p><p>The parabola is the funicular for load spread evenly per horizontal metre, the catenary for load spread evenly along the curve. For shallow arches the two are close.</p>`,
live:()=>['ellipse','parabola','catenary'].includes(S.arch)?`Rise ${fmtLen(G.op.rise)} on span ${fmtLen(S.span)} (rise ÷ span ${(G.op.rise/S.span).toFixed(3)})${G.op.info.extra?'. '+G.op.info.extra:''}.`:'Choose the Elliptical, Parabolic or Catenary head to see your numbers here.'},

{id:'bars',t:'Bars, frames and why cells are shrunk',
s:`<p>The tool draws each space where glass will go, then shrinks it all around by half a bar. Two neighbouring spaces both shrink, so what is left between them is exactly one bar wide. That keeps the stone an even thickness everywhere.</p>`,
d:`<p><b>Bar width</b> is the stone between lights. <b>Frame width</b> is the stone at the edge of the opening and is never less than half a bar. If the bars are too wide for the cells, the tool warns that no lights remain. Sharp inside corners of a cell become rounded in the glass, with a radius of half the bar.</p>`,
p:`<p>Each cell is offset on its own, then the results are clipped:</p><p><code>L = ( ⋃ offset(Cᵢ, −w/2) ) ∩ offset(O, −f_eff)</code>, <code>f_eff = max(f, w/2)</code></p><p>Offsetting the union of cells would merge neighbours and delete the bars between them, so it is never done. Concave cell corners round with radius w/2. Lights with area below (w/2)² are dropped as slivers.</p>`,
live:()=>`Bar ${fmtLen(S.bar)}: each cell shrinks ${fmtLen(S.bar/2)} per side. Effective frame ${fmtLen(G.fEff)}.`},

{id:'divisions',t:'Dividing a width: uniform, golden, Fibonacci',
s:`<p>To split an opening into three lights you can make them equal, or make each one bigger than the last by the golden ratio, or follow Fibonacci numbers: 1, 1, 2, 3, 5 and so on.</p>`,
d:`<p>Each scheme gives relative weights that grow from left to right (or bottom to top for rows). <b>Mirror divisions</b> reflects them so the biggest light is in the middle, which gives a symmetric window. Schemes apply to mullion spacing, geometric sub-lights and grid columns. <b>Row scheme</b> sets grid rows.</p>`,
p:`<p>Weights wᵢ = φⁱ or Fᵢ (1, 1, 2, 3, 5…), normalised so boundaries are <code>bᵢ = Σ₍ₖ&lt;ᵢ₎ wₖ / Σ wₖ</code>. Golden gives successive lengths in the exact ratio φ = (1 + √5)/2 ≈ 1.618. Fibonacci ratios converge to φ. Mirror mode builds weights for ⌈n/2⌉ divisions and reflects them, sharing the centre when n is odd.</p>`,
live:()=>{
  if(!['mullions','geometric','grid'].includes(S.pattern))return 'Choose the Mullioned, Geometric or Grid pattern to see your numbers here.';
  const n=Math.round(S.pattern==='grid'?S.cols:S.lights);
  const b=division(n,S.scheme,S.sym,S.span);
  const lens=diffs(b).map(x=>fmtLen(x*S.span));
  return `${n} division${n===1?'':'s'} across ${fmtLen(S.span)}: ${lens.join(' · ')}.`;
}},

{id:'modulor',t:'Modulor Red and Blue series',
s:`<p>Le Corbusier built a ruler from the golden ratio and the height of a standing person, 183 cm. It has two scales, Red and Blue. Each step is about 1.6 times the last, and any two neighbouring steps add up to the next. TRACERY cuts your opening into pieces using steps from this ruler.</p>`,
d:`<p>Red runs 4, 6, 10, 16, 27, 43, 70, 113, 183, 296, 479 cm. Blue is roughly double: 8, 13, 20, 33, 53, 86, 140, 226, 366, 592, 958 cm. For n divisions the tool finds the run of n consecutive terms whose total is closest to your opening, then scales it to fit. The <b>scale factor</b> shows how far you are from true Modulor. 1.000 is exact, 1.066 means 6.6% oversize. Choose opening sizes that are themselves series values (113, 183, 226 cm and so on) to get close to 1.</p>`,
p:`<p>The series are Fibonacci-like, tₖ ≈ t₀φᵏ, rounded to whole centimetres, so additivity tₖ + tₖ₊₁ = tₖ₊₂ holds only approximately (16 + 27 = 43, but 10 + 16 = 26 against 27).</p><p>Fit: for each start index i, <code>S_i = 10·Σ terms</code> (mm). Choose i minimising |S_i − L| / L, then <code>scale = L / S_i</code>. Mirror mode fits ⌈n/2⌉ terms and reflects them. Different axes get different scales.</p>`,
live:()=>{
  const g=['mullions','geometric','grid'].includes(S.pattern);
  if(g&&isMod(S.scheme)){
    const n=Math.round(S.pattern==='grid'?S.cols:S.lights);
    const t=modTerms(n,S.scheme==='modRed'?'red':'blue',S.span,S.sym);
    return `Columns: ${fmtTerms(t.terms,t.scale)}. Fit error before scaling ${(t.err*100).toFixed(1)}%.`;
  }
  const all=RED.concat(BLUE).map(v=>v*10);
  let best=all[0];
  all.forEach(v=>{if(Math.abs(v-S.span)<Math.abs(best-S.span))best=v;});
  return `Your span ${fmtLen(S.span)}. Nearest single Modulor value: ${fmtLen(best)}. Choose a Modulor division scheme to see the fit.`;
}},

{id:'geometric',t:'Geometric tracery: sub-lights and packed circles',
s:`<p>The opening is divided into smaller arched windows called sub-lights. The leftover space above them is then filled with circles. Each circle is grown until it touches the arch above and the sub-lights below, like blowing bubbles into a gap until they can no longer grow.</p>`,
d:`<p><b>Lights</b> is how many sub-windows. <b>Sub-light radius ÷ span</b> sets how pointed they are and <b>springing</b> sets how high their curves start. <b>Packed circles</b> is how many circles to place, <b>Smallest circle radius</b> stops tiny ones, and <b>Foil lobes</b> turns each circle into a trefoil, quatrefoil and so on. The biggest circle goes in first, then the next biggest gap is filled.</p>`,
p:`<p>Free space <code>F = offset(O, −fᵢ) \\ ⋃ sub-cells</code>, with fᵢ = f_eff − w/2. The largest inscribed circle is found on a grid of step max(8, size/90) mm. Each grid point stores its distance to the boundary (even-odd point-in-polygon, point-to-segment distance). The maximum is refined by hill climbing, trying 8 directions and shrinking the step by 0.6 when none improves. Placed circles are subtracted as min(d, |p − c| − r). This repeats for K circles or until r &lt; r_min.</p><p>The method is greedy, not globally optimal. The grid is symmetric about x = 0 and ties pick the left side first.</p>`,
live:()=>{
  if(S.pattern!=='geometric')return 'Choose the Geometric pattern to see your numbers here.';
  const n=G.notes.find(x=>x[0]==='Packed circles');
  return `${Math.round(S.lights)} sub-lights${n?'. '+n[0]+': '+n[1]:''}.`;
}},

{id:'foils',t:'Foils and cusps',
s:`<p>A trefoil is three overlapping circles gathered inside a bigger circle's footprint. The sharp points where two circles overlap are the cusps.</p>`,
d:`<p><b>Foil lobes</b> is the number of lobes: 3 trefoil, 4 quatrefoil, 5 cinquefoil, 6 sexfoil. TRACERY makes each lobe slightly larger than the exact touching size so neighbours overlap and form real cusps, and fills the centre so the shape is one light.</p>`,
p:`<p>Lobe radius <code>r_f = R · sin(π/n) / (1 + sin(π/n)) × 1.3</code>, capped at 0.92R. Lobe centres lie at distance R − r_f on angles π/2 + 2πk/n. The foil is the union of the lobe circles and the n-gon through their centres. At factor 1.0 neighbouring lobes only touch, giving zero-width cusps, so 1.3 is used to make the cusps visible.</p>`,
live:()=>{
  const n=S.pattern==='geometric'||S.pattern==='rose'?Math.round(S.foilN):0;
  if(n<3)return 'Set Foil lobes to 3 or more under Tracery to see your numbers here.';
  const sp=Math.sin(Math.PI/n);
  return `${n}-lobed foil: each lobe radius = ${Math.min(0.92,sp/(1+sp)*1.3).toFixed(3)} × the circle radius.`;
}},

{id:'rose',t:'Rose windows',
s:`<p>A rose window puts a ring of equal circles, the petals, around a central circle. Each petal touches its two neighbours and the outer frame. The more petals there are, the smaller each one gets.</p>`,
d:`<p><b>Petals</b> is how many around the ring. <b>Plate</b> style uses circles or foils. <b>Wheel</b> style uses radial spokes with a small hub. <b>Packed circles</b> fills the gaps between the petals and the frame. If the opening is not circular, the rose is placed in the largest circle that fits inside it.</p>`,
p:`<p>n equal circles tangent to each other and to an outer circle of radius R:</p><p><code>r_p = R · sin(π/n) / (1 + sin(π/n))</code>, centres at d = R − r_p, hub radius <code>R_h = d − r_p = R − 2r_p</code></p><p>The hub is tangent to all petals and is omitted below 8 mm. Wheel style cuts n sectors between angles 2πk/n with an inner arc at 0.2R. For non-circular openings R comes from the inscribed-circle search described under geometric tracery.</p>`,
live:()=>{
  if(S.pattern!=='rose')return 'Choose the Rose pattern to see your numbers here.';
  if(S.roseStyle==='wheel')return `${Math.round(S.petals)} spokes with a hub of 0.20 × the rose radius.`;
  const n=Math.round(S.petals),sp=Math.sin(Math.PI/n),rp=sp/(1+sp);
  return `${n} petals: petal radius = ${rp.toFixed(3)} × R, hub radius = ${(1-2*rp).toFixed(3)} × R.`;
}},

{id:'mondrian',t:'The Mondrian composition generator',
s:`<p>It starts with one big rectangle and keeps cutting one of the rectangles into two, at simple positions like a third or two fifths. It never cuts exactly in half, so the result does not look symmetrical. A few of the fields are then coloured red, blue and yellow, and the bars are black. The same seed always gives the same picture.</p>`,
d:`<p><b>Splits</b> is how many cuts are made. <b>Composition seed</b> picks the composition. Large fields tend to stay white, red goes on a larger field, blue and yellow on smaller ones, and black appears occasionally. A minimum field size prevents slivers. It is a study in Mondrian's manner, not a copy of a painting.</p>`,
p:`<p>Seeded mulberry32. Each step picks a rectangle with probability proportional to area^1.5 from those with a side ≥ 2.2·minD, where minD is 9% of the smaller overall dimension. The cut runs across the longer side when the aspect ratio exceeds 1.25 (random otherwise), at a fraction from {1/4, 1/3, 2/5, 3/5, 2/3, 3/4}, retrying up to 8 times if a part would be smaller than minD.</p><p>Colours are assigned by area rank: red from the 50th to 95th percentile, blue 10th to 60th, yellow 0 to 50th, and black (60% chance when there are at least 8 fields) 0 to 35th. A guillotine partition has only T-junctions.</p>`,
live:()=>{
  if(S.pattern==='mondrian'){const n=G.notes.find(x=>x[0]==='Composition');return `${Math.round(S.mondSplits)} splits: ${n?n[1]:''}.`;}
  const m=mondrianBuild(S.span,S.height,S.mondSeed,Math.round(S.mondSplits));
  return `With the current span, height, ${Math.round(S.mondSplits)} splits and seed ${Math.round(S.mondSeed)} the generator would make ${m.rects.length} fields. Choose the Mondrian pattern to see it.`;
}},

{id:'lattice',t:'Lattices, jali and tilings',
s:`<p>Fill the opening with a repeating tile: squares, hexagons, octagons with little squares between them, or stars. The tool then cuts the tiling to the shape of your window.</p>`,
d:`<p><b>Pitch</b> is the tile size and <b>Rotation</b> turns the whole pattern. <b>Star points</b> and <b>Star depth</b> shape the star, and <b>Diamond lights</b> adds small lights between stars. Tiles cut by the edge of the opening become partial lights, and tiny slivers are dropped. A smaller pitch gives more lights. If the window is more than about 420 pitch-squares in area, the pitch is enlarged until it is not.</p>`,
p:`<p>Square: side p. Hexagon (pointy-top): circumradius <code>p/√3</code>, rows 1.5R apart, odd rows offset p/2. Octagon plus square (4.8.8): octagons of circumradius <code>p / (2cos 22.5°)</code> at lattice points, diamonds of edge <code>a = p/(1 + √2)</code> and circumradius a/√2 at (p/2, p/2). Star: outer radius p/2 (0.96·p/2 unless n is a multiple of 4), inner radius = depth × outer, so tips touch when n is divisible by 4. The lattice is rotated about the window centre.</p>`,
live:()=>{
  if(S.pattern!=='lattice')return 'Choose the Lattice pattern to see your numbers here.';
  const a=G.notes.find(x=>x[0]==='Lattice pitch'),b=G.notes.find(x=>x[0]==='Cells');
  return `Pitch used ${a?a[1]:''}, ${b?b[1]:''} tiles before clipping.`;
}},

{id:'build3d',t:'How the 3D model is built',
s:`<p>The flat shapes are pushed out into thickness. The wall around the opening is one slab. The stone bars sit behind the face of the wall, and thin coloured glass sits in the middle of the bars. Chamfer softens the edges.</p>`,
d:`<p>Set <b>Wall thickness</b>, <b>Tracery depth</b> and <b>Setback</b> to model a deep reveal. <b>Explode layers</b> slides the wall forward and the glass back so you can see each part. <b>Sun azimuth and elevation</b> light the scene and cast shadows from the tracery onto the glass. The glass receives shadows but does not cast them. <b>Colour fills</b> choose stained tints, Mondrian colours or Corbusier polychromy.</p><p>The <b>Section</b> button cuts the model on a vertical plane and fills the cut faces in solid colour, ochre for stone and blue for glass, so you can read the wall thickness, the setback and the bar depth directly.</p>`,
p:`<p>Surround: extrude(R \\ O, D_w) from z = −D_w to 0. Tracery: extrude(T, D_t) starting at z = −setback − D_t. Glass: a slab of thickness <code>g = clamp(0.12·D_t, 8, 24)</code> mm centred in the tracery depth.</p><p>Chamfer b uses bevelThickness = bevelSize = b and bevelOffset = −b, so the profile stays at nominal size and the extrusion depth drops by 2b. For tracery b is limited to 0.45 × (w/2) so narrow bars keep a flat face, and to D/2.5. Hole nesting comes from Clipper's PolyTree and triangulation uses earcut.</p><p>Section: a clipping plane keeps x ≤ x_c. The cut faces are built from the model, not read from the mesh. For each layer the polygon set is intersected with a 1 mm strip at x = x_c, giving the stone and glass intervals [y₀, y₁] along that line. Each interval becomes a filled profile across the layer's depth, with the same chamfer as the solid.</p>`,
live:()=>`Wall ${fmtLen(S.wallDepth)}, tracery ${fmtLen(S.tracDepth)} set back ${fmtLen(S.setback)}, glass ${fmtLen(Math.max(8,Math.min(24,S.tracDepth*0.12)))} thick, chamfer ${fmtLen(Math.min(S.chamfer,G.hw*0.45))} on the tracery.`},

{id:'glazing',t:'Glazing ratio',
s:`<p>This is how much of the opening is glass and how much is stone, as a percentage.</p>`,
d:`<p>It drops with thick bars, small cells and jali screens, and rises with plain lights. Glazed fraction is one input to daylight and heat gain, along with glass type and orientation. It is a quick way to compare two tracery designs.</p>`,
p:`<p><code>ratio = A(L) / A(O)</code>. Areas are Clipper's signed polygon areas, where holes subtract, taken in integer units and divided by 100² to give mm². It is measured against the opening, not the whole wall, and ignores glazing rebates.</p>`,
live:()=>`${(G.glaze*100).toFixed(1)}% glass, ${(100-G.glaze*100).toFixed(1)}% stone.`},

{id:'export',t:'Exporting: SVG and DXF',
s:`<p>Exporting saves your window as a drawing or a model that other programs can open. SVG and the 2D DXF are flat drawings. The 3D DXF is a model made of many small flat triangles.</p>`,
d:`<p>SVG is always in millimetres. DXF files follow the Metric or Imperial setting and are written in millimetres or inches, and the file name ends -mm or -in. Set the units in your CAD import dialog, because the older format used cannot store them.</p><p>The <b>2D DXF</b> has five layers: OPENING, WALL, TRACERY (the stone profile with the glass cut out, useful for CNC or laser cutting), GLASS, and CONSTRUCTION (dashed compass circles, radii and centres). The <b>3D DXF</b> has WALL, TRACERY and GLASS. Glass colours are not exported, and the 3D file always holds the whole model, ignoring the section cut and exploded layers.</p>`,
p:`<p>Format: AutoCAD R12 ASCII (AC1009) with LTYPE and LAYER tables. Closed outlines are POLYLINE, VERTEX and SEQEND. Construction items are CIRCLE, LINE and POINT, and meshes are 3DFACE with the fourth corner repeating the third. R12 was chosen because nearly every CAD, CAM and BIM tool reads it.</p><p>Outlines are the polygons the app computes, about 4° of arc per segment, so a construction circle is exact and a head is a polyline. Coordinates are written to 4 decimals in millimetres or 6 in inches.</p><p>3D axes: the viewer's (x, y, z) become DXF <code>(x, −z, y)</code>, a pure rotation, so X is across, Y runs into the wall from the front face (Y = 0) and Z is up. Triangles come from the same extrusion and chamfer code as the 3D view.</p>`,
live:()=>`The 2D file would hold ${G.op.O.length} opening, ${G.surround.length} wall, ${G.tracery.length} tracery and ${G.lights.length} glass outline${G.lights.length===1?'':'s'}, plus ${G.cons.length} construction items. The file name would end -${UNITS==='imperial'?'in':'mm'}.`},

{id:'units',t:'Units and rounding',
s:`<p>You can show every length in millimetres or in feet and inches. Switching changes only how numbers are written, never the window.</p>`,
d:`<p>Sliders still move in millimetre steps, about 0.4 inch each, even in imperial mode. SVG export is always in millimetres. DXF export follows the unit setting and is written in millimetres or inches. Modulor series values are defined in centimetres, so imperial mode shows them in inches.</p>`,
p:`<p>All geometry is held in millimetres. Imperial display rounds to the nearest 1/16 inch below 24 inches and 1/8 inch above, reduces fractions (5/16″, not 10/32″) and writes exact feet without inches (10′). Modulor terms in imperial are cm ÷ 2.54 to one decimal.</p>`,
live:()=>`Your span is ${Math.round(S.span)} mm = ${fmtImp(S.span)}.`}
];

function helpTopicFor(sec){
  if(sec==='open'){
    const m={round:'arch-round',segmental:'arch-round',horseshoe:'arch-horseshoe',pointed:'arch-pointed',tudor:'arch-tudor',ogee:'arch-ogee',multifoil:'arch-multifoil',ellipse:'arch-curves',parabola:'arch-curves',catenary:'arch-curves',flat:'arch-curves',circle:'rose'};
    return m[S.arch]||'pipeline';
  }
  if(sec==='trac'){
    const m={plain:'pipeline',mullions:'divisions',geometric:'geometric',rose:'rose',grid:'divisions',mondrian:'mondrian',lattice:'lattice'};
    return m[S.pattern]||'pipeline';
  }
  if(sec==='bars')return 'bars';
  if(sec==='three')return 'build3d';
  return 'pipeline';
}

function helpPlain(html){return html.replace(/<[^>]*>/g,' ').replace(/&[a-z]+;/g,' ').toLowerCase();}

function helpLiveHtml(t){
  let txt='';
  try{txt=t.live?t.live():'';}catch(e){txt='';}
  if(!txt)return '';
  const off=/^(Choose|Set) /.test(txt);
  return `<div class="live${off?' off':''}"><b>${off?'Try it':'Your window'}</b>${escapeHtml(txt)}</div>`;
}

function renderHelp(){
  const nav=document.getElementById('helpNav'),box=document.getElementById('helpContent');
  nav.innerHTML=HELP_TABS.map(t=>`<button data-tab="${escapeAttr(t[0])}" class="${helpState.tab===t[0]?'on':''}">${escapeHtml(t[1])}</button>`).join('');
  const tab=helpState.tab;
  let h='';
  const dl=(rows)=>'<dl>'+rows.map(r=>`<div class="item" data-s="${escapeAttr(helpPlain(r[0]+' '+r[1]))}"><dt>${escapeHtml(r[0])}</dt><dd>${escapeHtml(r[1])}</dd></div>`).join('')+'</dl>';
  if(tab==='start'){
    h=`<div class="item" data-s="${escapeAttr(helpPlain(HELP_START))}">${HELP_START}</div>`;
  }else if(tab==='controls'){
    HELP_CONTROLS.forEach(g=>{h+=`<section class="grp"><h2>${escapeHtml(g[0])}</h2>${dl(g[1])}</section>`;});
  }else if(tab==='math'){
    h='<div class="lvlbar">'+HELP_LEVELS.map(l=>`<button data-lvl="${escapeAttr(l[0])}" class="${helpState.level===l[0]?'on':''}">${escapeHtml(l[1])}</button>`).join('')+'</div>';
    h+='<p class="lvlnote">'+({s:'Plain language and pictures in words.',d:'The vocabulary and controls you would use in practice.',p:'Equations, tolerances and algorithms.'})[helpState.level]+'</p>';
    HELP_TOPICS.forEach(t=>{
      const all=helpPlain(t.t+' '+t.s+' '+t.d+' '+t.p);
      h+=`<article class="item topic" id="help-topic-${escapeAttr(t.id)}" data-s="${escapeAttr(all)}"><h2>${escapeHtml(t.t)}</h2>${t[helpState.level]}${helpLiveHtml(t)}</article>`;
    });
  }else if(tab==='numbers'){
    h='<h2>The analysis strip</h2><p>The strip under the two views reports these values for the window on screen. Which ones appear depends on the head and pattern.</p><section class="grp">'+dl(HELP_NUMBERS)+'</section>';
  }else if(tab==='glossary'){
    h='<h2>Glossary</h2><section class="grp">'+dl(HELP_GLOSSARY)+'</section>';
  }else{
    h='<h2>What TRACERY does not do</h2><ul>'+HELP_LIMITS.map(x=>`<li class="item" data-s="${escapeAttr(helpPlain(x))}">${escapeHtml(x)}</li>`).join('')+'</ul>';
  }
  box.innerHTML=h;
  helpFilter();
}

function helpFilter(){
  const q=helpState.q.trim().toLowerCase();
  const box=document.getElementById('helpContent');
  box.querySelectorAll('.item').forEach(el=>{el.hidden=!!q&&el.getAttribute('data-s').indexOf(q)<0;});
  box.querySelectorAll('.grp').forEach(g=>{g.hidden=!!q&&!g.querySelector('.item:not([hidden])');});
}

function openHelp(tab,topic){
  if(tab)helpState.tab=tab;
  helpState.q='';
  document.getElementById('helpSearch').value='';
  document.getElementById('help').hidden=false;
  renderHelp();
  const box=document.getElementById('helpContent');
  box.scrollTop=0;
  if(topic){
    const el=document.getElementById('help-topic-'+topic);
    if(el){
      el.scrollIntoView({block:'start'});
      el.classList.add('flash');
      setTimeout(()=>el.classList.remove('flash'),1600);
    }
  }
}
function closeHelp(){
  document.getElementById('help').hidden=true;
}

function helpInit(){
  try{
    const l=localStorage.getItem(HELP_LVL_KEY);
    if(l==='s'||l==='d'||l==='p')helpState.level=l;
  }catch(e){}
  const el=document.getElementById('help');
  el.addEventListener('click',e=>{
    const tb=e.target.closest('[data-tab]');
    if(tb){
      helpState.tab=tb.getAttribute('data-tab');
      renderHelp();
      document.getElementById('helpContent').scrollTop=0;
      return;
    }
    const lb=e.target.closest('[data-lvl]');
    if(lb){
      helpState.level=lb.getAttribute('data-lvl');
      try{localStorage.setItem(HELP_LVL_KEY,helpState.level);}catch(err){}
      const box=document.getElementById('helpContent');
      const y=box.scrollTop;
      renderHelp();
      box.scrollTop=y;
    }
  });
  document.getElementById('helpSearch').addEventListener('input',e=>{helpState.q=e.target.value;helpFilter();});
  document.getElementById('helpClose').addEventListener('click',closeHelp);
  document.getElementById('btnHelp').addEventListener('click',()=>openHelp('start'));
  document.getElementById('blockHelp').addEventListener('click',()=>openHelp('start'));
  document.getElementById('side').addEventListener('click',e=>{
    const b=e.target.closest('.info');
    if(!b)return;
    e.preventDefault();
    e.stopPropagation();
    openHelp('math',helpTopicFor(b.getAttribute('data-help')));
  });
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape')return;
    if(!document.getElementById('help').hidden)closeHelp();
  });
}

function fmtVal(p,v){
  if(p.k==='foilN'||p.k==='subFoils')return v<3?'none':String(v);
  if(p.u==='mm')return fmtLen(v);
  const dec=p.step<0.1?2:p.step<1?1:0;
  return Number(v).toFixed(dec)+(p.u?' '+p.u:'');
}

function buildControls(){
  const side=document.getElementById('side');
  let html='<div class="side-tools"><button id="btnCollapse">Collapse all</button><button id="btnExpand">Expand all</button></div>';
  SECTIONS.forEach(sec=>{
    html+=`<details class="sec" data-sec="${escapeAttr(sec.id)}"${secOpen[sec.id]?' open':''}><summary><span>${escapeHtml(sec.title)}</span><button class="info" data-help="${escapeAttr(sec.id)}" title="How this works">?</button></summary><div class="rows">`;
    sec.p.forEach(p=>{
      if(p.t==='range'){
        html+=`<div class="row" data-k="${escapeAttr(p.k)}"><label for="c_${escapeAttr(p.k)}">${escapeHtml(p.l)}</label><span class="val" id="v_${escapeAttr(p.k)}"></span><input id="c_${escapeAttr(p.k)}" type="range" min="${p.min}" max="${p.max}" step="${p.step}"></div>`;
      }else if(p.t==='select'){
        html+=`<div class="row" data-k="${escapeAttr(p.k)}"><label for="c_${escapeAttr(p.k)}">${escapeHtml(p.l)}</label><select id="c_${escapeAttr(p.k)}">${p.o.map(o=>`<option value="${escapeAttr(o[0])}">${escapeHtml(o[1])}</option>`).join('')}</select></div>`;
      }else{
        html+=`<div class="row chk" data-k="${escapeAttr(p.k)}"><label><input id="c_${escapeAttr(p.k)}" type="checkbox"> ${escapeHtml(p.l)}</label></div>`;
      }
    });
    html+='</div></details>';
  });
  side.innerHTML=html;
  side.addEventListener('input',onControl);
  side.addEventListener('change',onControl);
  side.addEventListener('toggle',e=>{
    const d=e.target;
    if(d&&d.matches&&d.matches('details.sec')){
      secOpen[d.getAttribute('data-sec')]=d.open;
      saveSecOpen();
    }
  },true);
  side.addEventListener('click',e=>{
    const all=e.target.closest('#btnCollapse,#btnExpand');
    if(!all)return;
    const open=all.id==='btnExpand';
    side.querySelectorAll('details.sec').forEach(d=>{d.open=open;});
  });
}

function findParam(k){
  for(const sec of SECTIONS)for(const p of sec.p)if(p.k===k)return p;
  return null;
}

function onControl(e){
  const id=e.target.id||'';
  if(id.indexOf('c_')!==0)return;
  const k=id.slice(2);
  const p=findParam(k);
  if(!p)return;
  if(p.t==='range')S[k]=parseFloat(e.target.value);
  else if(p.t==='check')S[k]=e.target.checked;
  else S[k]=e.target.value;
  if(k==='arch'&&ARCH_DEFAULTS[S.arch])Object.assign(S,ARCH_DEFAULTS[S.arch]);
  if(k==='arch'||k==='pattern'||k==='roseStyle'||k==='latCell'||k==='warp'||k==='subFoils'||k==='secOn'){syncControls();}
  else{
    const vv=document.getElementById('v_'+k);
    if(vv)vv.textContent=fmtVal(p,S[k]);
  }
  if(k==='arch'||k==='span'||k==='height')view.fit=true;
  saveState();
  schedule(!!p.g);
}

function syncControls(){
  SECTIONS.forEach(sec=>sec.p.forEach(p=>{
    const el=document.getElementById('c_'+p.k);
    if(!el)return;
    if(p.t==='check')el.checked=!!S[p.k];
    else el.value=S[p.k];
    const vv=document.getElementById('v_'+p.k);
    if(vv)vv.textContent=fmtVal(p,S[p.k]);
    const row=el.closest('.row');
    if(row)row.hidden=p.show?!p.show(S):false;
  }));
  ['lyStone','lyGlass','lyCons','lyDims'].forEach(k=>{
    const el=document.getElementById('ly_'+k);
    if(el)el.checked=!!S[k];
  });
}

function saveState(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const o=JSON.parse(raw);
      S=Object.assign({},DEFAULT,o);
      if(S.scheme==='modulor')S.scheme='modBlue';
      if(S.rowScheme==='modulor')S.rowScheme='modBlue';
    }
  }catch(e){}
}


const SHUF_ARCH=['round','segmental','horseshoe','pointed','tudor','ogee','multifoil','ellipse','parabola','catenary','flat','circle'];
const SHUF_PAT=['mullions','geometric','rose','grid','mondrian','lattice'];
const SHUF_SCHEMES=['uniform','golden','fibonacci','modBlue','modRed'];
let shufHist=[];

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function rr(a,b,step){
  const v=a+Math.random()*(b-a);
  return step?Math.round(v/step)*step:v;
}
function rseed(){return 1+Math.floor(Math.random()*998);}

function shuffleHead(T){
  switch(T.arch){
    case 'pointed':T.rho=rr(0.6,1.9,0.01);break;
    case 'segmental':T.rise=rr(0.12,0.4,0.01);break;
    case 'horseshoe':T.stilt=rr(0.15,0.6,0.01);break;
    case 'tudor':T.rise=rr(0.22,0.4,0.01);T.r1=rr(0.08,0.2,0.005);T.phi=rr(28,55,1);break;
    case 'ogee':T.rise=rr(0.7,1.0,0.01);T.r1=rr(0.1,0.2,0.005);T.phi=rr(50,72,1);break;
    case 'multifoil':T.rho=rr(0.5,1.3,0.01);T.lobes=pick([3,5,7,9]);T.bulge=rr(0.55,1.1,0.01);break;
    case 'ellipse':T.rise=rr(0.25,0.5,0.01);break;
    case 'parabola':T.rise=rr(0.35,0.8,0.01);break;
    case 'catenary':T.rise=rr(0.5,1.1,0.01);break;
    default:break;
  }
}

function shufflePattern(T){
  switch(T.pattern){
    case 'mullions':
      T.lights=pick([2,3,3,4,5,6]);T.scheme=pick(SHUF_SCHEMES);T.sym=Math.random()<0.4;
      break;
    case 'geometric':
      T.lights=pick([2,2,3,4]);T.scheme=Math.random()<0.8?'uniform':pick(SHUF_SCHEMES);T.sym=false;
      T.subRho=rr(0.5,1.8,0.01);T.subSpring=rr(0.55,0.92,0.01);T.subFoils=pick([0,0,3,5]);T.subBulge=rr(0.6,1,0.01);
      T.circles=pick([0,1,1,2,3,4]);T.minR=rr(30,80,1);T.foilN=pick([0,3,4,5,6,8]);
      break;
    case 'rose':
      T.petals=pick([6,8,10,12,14,16]);T.roseStyle=Math.random()<0.8?'plate':'wheel';
      T.circles=pick([0,0,6,10,14]);T.foilN=pick([0,3,4,5]);T.minR=rr(25,50,1);
      break;
    case 'grid':
      T.cols=pick([2,3,3,4,5,6]);T.rows=pick([3,4,5,6,7,8,9]);
      T.scheme=pick(SHUF_SCHEMES);T.rowScheme=pick(SHUF_SCHEMES);T.sym=Math.random()<0.3;
      T.warp=pick([0,0,40,70,100]);T.warpLen=rr(900,2200,10);T.seed=rseed();T.polychrome=Math.random()<0.5;
      break;
    case 'mondrian':
      T.mondSplits=pick([5,6,7,8,9,10,12]);T.mondSeed=rseed();
      break;
    case 'lattice':
      T.latCell=pick(['square','hexagon','octagon','star']);T.pitch=rr(170,340,5);T.rot=pick([0,0,15,30,45]);
      T.starPts=pick([6,8,10,12]);T.starDepth=rr(0.4,0.7,0.01);T.dual=Math.random()<0.7;
      break;
    default:break;
  }
}

function shuffleBars(T){
  if(T.pattern==='mondrian')T.bar=rr(40,56,1);
  else if(T.pattern==='lattice')T.bar=rr(24,40,1);
  else T.bar=rr(28,60,1);
  T.frame=Math.min(120,Math.round(T.bar*rr(0.8,1.8)));
}

function shuffleOk(T,g){
  if(g.warn)return false;
  if(g.nLights<1||g.nLights>260)return false;
  if(T.pattern!=='plain'&&(g.glaze<0.15||g.glaze>0.92))return false;
  return true;
}

function updateBackBtn(){
  const b=document.getElementById('btnBack');
  if(b)b.disabled=shufHist.length===0;
}

function doShuffle(all){
  const snap=Object.assign({},S);
  let found=null;
  for(let t=0;t<14&&!found;t++){
    const T=Object.assign({},snap);
    if(all){
      T.arch=pick(SHUF_ARCH);
      Object.assign(T,ARCH_DEFAULTS[T.arch]||{});
      T.pattern=pick(SHUF_PAT);
      T.height=Math.min(6000,Math.max(800,Math.round(snap.height*rr(0.9,1.12)/10)*10));
    }
    shuffleHead(T);
    if(T.pattern!=='plain')shufflePattern(T);
    shuffleBars(T);
    S=T;
    try{
      const g=compute(T);
      if(shuffleOk(T,g))found=T;
    }catch(e){}
  }
  S=snap;
  if(!found){
    toast('No valid variation found — try again');
    return;
  }
  shufHist.push(snap);
  if(shufHist.length>20)shufHist.shift();
  S=found;
  view.fit=true;
  syncControls();
  saveState();
  schedule(true);
  updateBackBtn();
  toast(all?'Shuffled — new head and pattern':'Shuffled');
}

function shuffleBack(){
  if(!shufHist.length)return;
  S=shufHist.pop();
  view.fit=true;
  syncControls();
  saveState();
  schedule(true);
  updateBackBtn();
  toast('Back to the previous design');
}

function applyPreset(i){
  S=Object.assign({},DEFAULT,PRESETS[i].s);
  view.fit=true;
  needCam=true;
  syncControls();
  saveState();
  schedule(true);
}

function applyTheme(t){
  if(t==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('btnTheme').textContent=t==='light'?'Dark':'Light';
  document.getElementById('themeColorMeta').setAttribute('content',t==='light'?'#F4F1EA':'#0E1220');
  dirty2d=true;
}
function applyUnits(u){
  UNITS=u==='imperial'?'imperial':'metric';
  document.getElementById('btnUnits').textContent=UNITS==='imperial'?'Metric':'Imperial';
}
function toggleUnits(){
  applyUnits(UNITS==='imperial'?'metric':'imperial');
  try{localStorage.setItem(UNITS_KEY,UNITS);}catch(e){}
  syncControls();
  schedule(true);
  toast(UNITS==='imperial'?'Imperial — feet and inches':'Metric — millimetres');
}
function loadSecOpen(){
  try{
    const raw=localStorage.getItem(SEC_KEY);
    if(raw){
      const o=JSON.parse(raw);
      Object.keys(secOpen).forEach(k=>{if(typeof o[k]==='boolean')secOpen[k]=o[k];});
    }
  }catch(e){}
}
function saveSecOpen(){
  try{localStorage.setItem(SEC_KEY,JSON.stringify(secOpen));}catch(e){}
}
function applySide(on){
  document.querySelector('.work').classList.toggle('side-off',!on);
  document.getElementById('btnSide').classList.toggle('on',on);
}
function toggleSide(){
  const turnOn=document.querySelector('.work').classList.contains('side-off');
  applySide(turnOn);
  try{localStorage.setItem(SIDE_KEY,turnOn?'on':'off');}catch(e){}
  view.fit=true;
  dirty2d=true;
  requestAnimationFrame(()=>{resize3D();dirty2d=true;});
}

function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';
  const next=cur==='light'?'dark':'light';
  applyTheme(next);
  try{localStorage.setItem(THEME_KEY,next);}catch(e){}
}


function dxfUnits(){
  return UNITS==='imperial'?{f:1/25.4,d:6,name:'inches',tag:'in'}:{f:1,d:4,name:'millimetres',tag:'mm'};
}

function dxfHead(g,u,layers,note){
  g(999,note);
  g(0,'SECTION');g(2,'HEADER');g(9,'$ACADVER');g(1,'AC1009');g(0,'ENDSEC');
  g(0,'SECTION');g(2,'TABLES');
  g(0,'TABLE');g(2,'LTYPE');g(70,2);
  g(0,'LTYPE');g(2,'CONTINUOUS');g(70,0);g(3,'Solid line');g(72,65);g(73,0);g(40,0);
  const dash=(20*u.f).toFixed(u.d),gap=(-10*u.f).toFixed(u.d),tot=(30*u.f).toFixed(u.d);
  g(0,'LTYPE');g(2,'DASHED');g(70,0);g(3,'Dashed');g(72,65);g(73,2);g(40,tot);g(49,dash);g(49,gap);
  g(0,'ENDTAB');
  g(0,'TABLE');g(2,'LAYER');g(70,layers.length);
  layers.forEach(l=>{g(0,'LAYER');g(2,l[0]);g(70,0);g(62,l[1]);g(6,l[2]||'CONTINUOUS');});
  g(0,'ENDTAB');
  g(0,'ENDSEC');
  g(0,'SECTION');g(2,'ENTITIES');
}

function dxfTail(g){
  g(0,'ENDSEC');
  g(0,'EOF');
}

function dxfPoly(g,layer,pts){
  g(0,'POLYLINE');g(8,layer);g(66,1);g(70,1);g(10,0);g(20,0);g(30,0);
  pts.forEach(p=>{g(0,'VERTEX');g(8,layer);g(10,p[0]);g(20,p[1]);g(30,0);});
  g(0,'SEQEND');g(8,layer);
}

function dxf2dText(){
  const u=dxfUnits();
  const L=[];
  const g=(c,v)=>{L.push(c);L.push(v);};
  const n=v=>(v*u.f).toFixed(u.d);
  const layers=[['OPENING',5],['WALL',8],['TRACERY',2],['GLASS',4],['CONSTRUCTION',3,'DASHED']];
  dxfHead(g,u,layers,'TRACERY v'+APP_VERSION+' 2D elevation, units: '+u.name+', X across, Y up');
  const path=p=>p.map(q=>[n(q.X/SC),n(q.Y/SC)]);
  G.op.O.forEach(p=>dxfPoly(g,'OPENING',path(p)));
  G.surround.forEach(p=>dxfPoly(g,'WALL',path(p)));
  G.tracery.forEach(p=>dxfPoly(g,'TRACERY',path(p)));
  G.lights.forEach(p=>dxfPoly(g,'GLASS',path(p)));
  G.cons.forEach(o=>{
    if(o.k==='c'){g(0,'CIRCLE');g(8,'CONSTRUCTION');g(10,n(o.cx));g(20,n(o.cy));g(30,0);g(40,n(o.r));}
    else if(o.k==='l'){g(0,'LINE');g(8,'CONSTRUCTION');g(10,n(o.x0));g(20,n(o.y0));g(30,0);g(11,n(o.x1));g(21,n(o.y1));g(31,0);}
    else{g(0,'POINT');g(8,'CONSTRUCTION');g(10,n(o.x));g(20,n(o.y));g(30,0);}
  });
  dxfTail(g);
  return L.join('\n')+'\n';
}

function dxfFaces(g,u,layer,geo,zOff,counter){
  const pos=geo.attributes.position;
  const idx=geo.index;
  const count=idx?idx.count:pos.count;
  const vx=i=>{
    const k=idx?idx.getX(i):i;
    const x=pos.getX(k),y=pos.getY(k),z=pos.getZ(k)+zOff;
    return [(x*u.f).toFixed(u.d),(-z*u.f).toFixed(u.d),(y*u.f).toFixed(u.d)];
  };
  for(let i=0;i+2<count;i+=3){
    const a=vx(i),b=vx(i+1),c=vx(i+2);
    g(0,'3DFACE');g(8,layer);
    g(10,a[0]);g(20,a[1]);g(30,a[2]);
    g(11,b[0]);g(21,b[1]);g(31,b[2]);
    g(12,c[0]);g(22,c[1]);g(32,c[2]);
    g(13,c[0]);g(23,c[1]);g(33,c[2]);
    counter.n++;
  }
}

function dxf3dText(){
  const u=dxfUnits();
  const L=[];
  const g=(c,v)=>{L.push(c);L.push(v);};
  const counter={n:0};
  const layers=[['WALL',8],['TRACERY',2],['GLASS',4]];
  dxfHead(g,u,layers,'TRACERY v'+APP_VERSION+' 3D model, units: '+u.name+', X across, Y into the wall from the front face, Z up');
  const cham=Math.min(S.chamfer,G.hw*0.45);
  const wallShapes=G.surTree.Childs().length?treeShapes(G.surTree).map(s=>polyShape(s.outer,s.holes)):[];
  const tracShapes=treeShapes(G.tracTree).map(s=>polyShape(s.outer,s.holes));
  const wallD=S.wallDepth,tracD=S.tracDepth;
  if(wallShapes.length)dxfFaces(g,u,'WALL',solidGeo(wallShapes,wallD,S.chamfer),-wallD,counter);
  if(tracShapes.length)dxfFaces(g,u,'TRACERY',solidGeo(tracShapes,tracD,cham),-S.setback-tracD,counter);
  const gt=Math.max(8,Math.min(24,tracD*0.12));
  G.lightShapes.forEach(sh=>{
    const geo=new THREE.ExtrudeGeometry([polyShape(sh.outer,sh.holes)],{depth:gt,bevelEnabled:false,curveSegments:1,steps:1});
    dxfFaces(g,u,'GLASS',geo,-S.setback-tracD/2-gt/2,counter);
    geo.dispose();
  });
  dxfTail(g);
  return {text:L.join('\n')+'\n',faces:counter.n};
}

function downloadText(name,text,type){
  const blob=new Blob([text],{type});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

function exportDxf(kind){
  if(!G)return;
  const u=dxfUnits();
  const base='tracery-'+S.arch+'-'+S.pattern;
  if(kind==='dxf2d'){
    downloadText(base+'-2d-'+u.tag+'.dxf',dxf2dText(),'application/dxf');
    toast('DXF 2D exported in '+u.name);
  }else{
    const r=dxf3dText();
    downloadText(base+'-3d-'+u.tag+'.dxf',r.text,'application/dxf');
    toast('DXF 3D exported in '+u.name+' · '+r.faces.toLocaleString('en-US')+' faces');
  }
}

function exportSvg(){
  if(!G)return;
  const R=G.rect;
  const pd=paths=>paths.map(p=>'M'+p.map(q=>(q.X/SC).toFixed(1)+' '+(q.Y/SC).toFixed(1)).join('L')+'Z').join('');
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${R.x0} ${-R.y1} ${R.x1-R.x0} ${R.y1-R.y0}" width="${(R.x1-R.x0)/2}" height="${(R.y1-R.y0)/2}"><g transform="scale(1,-1)" fill="none" stroke="#111" stroke-width="2">`;
  svg+=`<rect x="${R.x0}" y="${R.y0}" width="${R.x1-R.x0}" height="${R.y1-R.y0}" stroke-width="1"/>`;
  svg+=`<path d="${pd(G.op.O)}" stroke-width="3"/>`;
  svg+=`<path d="${pd(G.lights)}" fill-rule="evenodd" fill="#cfe0ff"/>`;
  if(S.lyCons){
    svg+='<g stroke="#7C5CFC" stroke-width="1" stroke-dasharray="6 5">';
    G.cons.forEach(o=>{
      if(o.k==='c')svg+=`<circle cx="${o.cx.toFixed(1)}" cy="${o.cy.toFixed(1)}" r="${o.r.toFixed(1)}"/>`;
      else if(o.k==='l')svg+=`<line x1="${o.x0.toFixed(1)}" y1="${o.y0.toFixed(1)}" x2="${o.x1.toFixed(1)}" y2="${o.y1.toFixed(1)}"/>`;
    });
    svg+='</g>';
  }
  svg+='</g></svg>';
  const blob=new Blob([svg],{type:'image/svg+xml'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='tracery-window.svg';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('SVG exported in millimetres');
}

function checkBlock(){
  blocked=window.innerWidth<760;
  document.getElementById('block').style.display=blocked?'flex':'none';
  if(!blocked){dirty2d=true;resize3D();}
}

function setupPointer(){
  let drag=null;
  cv2d.addEventListener('pointerdown',e=>{
    drag={x:e.clientX,y:e.clientY};
    cv2d.setPointerCapture(e.pointerId);
  });
  cv2d.addEventListener('pointermove',e=>{
    if(!drag)return;
    view.fit=false;
    view.x+=e.clientX-drag.x;
    view.y+=e.clientY-drag.y;
    drag={x:e.clientX,y:e.clientY};
    dirty2d=true;
  });
  const end=e=>{drag=null;try{cv2d.releasePointerCapture(e.pointerId);}catch(err){}};
  cv2d.addEventListener('pointerup',end);
  cv2d.addEventListener('pointercancel',end);
  cv2d.addEventListener('dblclick',()=>{view.fit=true;dirty2d=true;});
  cv2d.addEventListener('wheel',e=>{
    e.preventDefault();
    view.fit=false;
    const r=cv2d.getBoundingClientRect();
    const mx=e.clientX-r.left-r.width/2,my=e.clientY-r.top-r.height/2;
    const f=Math.exp(-e.deltaY*0.0015);
    view.k*=f;
    view.x=mx-(mx-view.x)*f;
    view.y=my-(my-view.y)*f;
    dirty2d=true;
  },{passive:false});
}

function initUi(){
  const sel=document.getElementById('presetSel');
  sel.innerHTML='<option value="">Presets…</option>'+PRESETS.map((p,i)=>`<option value="${i}">${escapeHtml(p.n)}</option>`).join('');
  sel.addEventListener('change',()=>{
    if(sel.value==='')return;
    applyPreset(parseInt(sel.value,10));
    sel.value='';
  });
  document.getElementById('btnShuffle').addEventListener('click',()=>doShuffle(false));
  document.getElementById('btnShuffleAll').addEventListener('click',()=>doShuffle(true));
  document.getElementById('btnBack').addEventListener('click',shuffleBack);
  const ex=document.getElementById('exportSel');
  ex.addEventListener('change',()=>{
    const v=ex.value;
    ex.value='';
    if(v==='svg')exportSvg();
    else if(v==='dxf2d'||v==='dxf3d')exportDxf(v);
  });
  document.getElementById('btnReset').addEventListener('click',async()=>{
    const ok=await confirmDialog('Reset every parameter to its default?','Reset');
    if(!ok)return;
    S=Object.assign({},DEFAULT);
    view.fit=true;needCam=true;
    syncControls();saveState();schedule(true);
    toast('Reset to defaults');
  });
  document.getElementById('btnTheme').addEventListener('click',toggleTheme);
  document.getElementById('btnSide').addEventListener('click',toggleSide);
  document.getElementById('btnUnits').addEventListener('click',toggleUnits);
  document.getElementById('btnFit').addEventListener('click',()=>{view.fit=true;dirty2d=true;});
  document.getElementById('btnView3d').addEventListener('click',resetView3d);
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
    const name=b.getAttribute('data-view');
    const want=name==='side';
    if(S.secOn!==want){S.secOn=want;syncControls();saveState();}
    schedule(false);
    setView(name);
  }));
  ['lyStone','lyGlass','lyCons','lyDims'].forEach(k=>{
    document.getElementById('ly_'+k).addEventListener('change',e=>{S[k]=e.target.checked;saveState();dirty2d=true;});
  });
  const foot=document.getElementById('footVersion');
  foot.innerHTML=`<a href="https://axisbim.io" target="_blank" rel="noopener">${escapeHtml(`TRACERY · v${APP_VERSION} · Joe.K · axisbim.io`)}</a>`;
}

function start(){
  loadState();
  let theme='dark';
  try{theme=localStorage.getItem(THEME_KEY)||'dark';}catch(e){}
  applyTheme(theme);
  let units='metric';
  try{units=localStorage.getItem(UNITS_KEY)||'metric';}catch(e){}
  applyUnits(units);
  loadSecOpen();
  buildControls();
  initUi();
  let sideState='on';
  try{sideState=localStorage.getItem(SIDE_KEY)||'on';}catch(e){}
  applySide(sideState!=='off');
  syncControls();
  setupPointer();
  helpInit();
  init3D();
  checkBlock();
  window.addEventListener('resize',()=>{checkBlock();resize3D();dirty2d=true;});
  if(window.ResizeObserver){
    new ResizeObserver(()=>{resize3D();dirty2d=true;}).observe(stage2d);
    new ResizeObserver(()=>{resize3D();}).observe(stage3d);
  }
  schedule(true);
  requestAnimationFrame(loop);
}
start();
</script>
