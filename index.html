<style>

*{box-sizing:border-box;border-radius:0}
[hidden]{display:none!important}
input[type=text],input[type=url],input[type=search]{font-size:16px}
html,body{height:100%;margin:0}
body{

.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.22em;font-size:15px}

button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
select{background:var(--btnbg);border:1px solid var(--line);padding:6px 8px;color:var(--ink);max-width:100%}
.work{flex:1;min-height:0;display:grid;grid-template-columns:318px 1fr}

.side-tools{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line)}
.side-tools button{flex:1;padding:4px 8px;font-size:11px}
#btnSide.on{border-color:var(--accent);color:var(--accent)}
#side{overflow-y:auto;border-right:1px solid var(--line);background:var(--card);padding:4px 0 24px}
.sec{border-bottom:1px solid var(--line)}

.sec>summary::-webkit-details-marker{display:none}
.sec>summary>span{flex:1}
.info{padding:1px 8px;font-size:11px;font-family:'Space Mono',monospace;color:var(--mute);background:none}
.sec>summary::before{content:'+ ';color:var(--mute)}

.rows{padding:0 14px 12px;display:grid;gap:9px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.row[hidden]{display:none}
.row label{color:var(--mute);font-size:11px}
.row .val{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink);text-align:right}

.row.chk input{accent-color:var(--accent)}
#main{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0}
.panes{display:grid;grid-template-columns:1fr 1fr;min-height:0;min-width:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.pane:last-child{border-right:none}
.pane-h{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--mute);flex-wrap:wrap}
.pane-h b{color:var(--ink);font-weight:700}
.pane-h .sp{flex:1}
.pane-h button{padding:3px 8px;font-size:11px}
.pane-h label{display:flex;align-items:center;gap:4px;letter-spacing:0;font-family:'Inter',sans-serif;font-size:11px;cursor:pointer;color:var(--ink)}
.pane-h input{accent-color:var(--accent);margin:0}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
.stage canvas{display:block;position:absolute;inset:0}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-family:'Space Mono',monospace;font-size:12px;padding:20px;text-align:center}
.analysis{border-top:1px solid var(--line);background:var(--card);padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px;max-height:170px;overflow-y:auto}

.kv span:last-child{font-family:'Space Mono',monospace;font-size:11px;text-align:right}
.kv.warn span:last-child{color:var(--warn)}
.note{grid-column:1/-1;color:var(--mute);font-size:12px;line-height:1.45;padding-top:4px}
footer{padding:5px 14px;border-top:1px solid var(--line);font-family:'Space Mono',monospace;font-size:10px;color:var(--mute);background:var(--card)}
footer a{color:var(--mute);text-decoration:none}
footer a:hover{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:9px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:80vw}

.modal{position:fixed;inset:0;background:rgba(5,7,14,.62);display:flex;align-items:center;justify-content:center;z-index:60}

.modal .box{background:var(--card);border:1px solid var(--line);padding:20px;max-width:340px;width:86%}

.modal .box .acts{display:flex;gap:8px;justify-content:flex-end}
.block{position:fixed;inset:0;background:var(--paper);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:32px;text-align:center;gap:14px}
.block h1{font-family:'Space Grotesk',sans-serif;letter-spacing:.3em;font-size:22px;margin:0}
.block p{color:var(--mute);max-width:300px;line-height:1.5;margin:0}
.block .bar{width:64px;height:6px;background:var(--accent)}
.help{position:fixed;inset:0;z-index:120;background:var(--paper);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.help-top{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card)}

.help-body{flex:1;min-height:0;display:grid;grid-template-columns:210px minmax(0,1fr)}
.help-nav{border-right:1px solid var(--line);background:var(--card);padding:8px 0;overflow-y:auto;display:flex;flex-direction:column}

.help-content{overflow-y:auto;padding:20px 28px 70px;line-height:1.6;font-size:14px}

.help-content h2{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:26px 0 8px}
.help-content>h2:first-child,.help-content>.item>h2:first-child{margin-top:0}
.help-content p{margin:0 0 10px}
.help-content ul,.help-content ol{margin:0 0 10px;padding-left:22px}
.help-content li{margin-bottom:5px}
.help-content code{font-family:'Space Mono',monospace;font-size:12px;background:var(--btnbg);padding:1px 5px;word-break:break-word}
.help-content dt{font-weight:600;margin-top:10px}
.help-content dd{margin:2px 0 0;color:var(--mute)}
.help-content .live{border-left:3px solid var(--accent);background:var(--card);padding:8px 12px;margin:12px 0 26px;font-size:13px}
.help-content .live b{color:var(--accent);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-right:10px}
.help-content .topic{padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px;scroll-margin-top:64px}

.help-content .topic.flash{background:var(--card)}
.lvlbar{display:flex;position:sticky;top:-20px;background:var(--paper);padding:8px 0;z-index:2}
.lvlbar button{flex:1;max-width:160px;border-right:none;padding:8px 10px}

.lvlnote{color:var(--mute);font-size:12px;margin:2px 0 14px}
@media (max-width:760px){
  .help-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .help-nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid var(--line);padding:0}
  .help-nav button{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:12px 14px}
  .help-nav button.on{border-bottom-color:var(--accent)}
  .help-content{padding:16px 16px 70px}
  .help-top input{width:120px;max-width:34vw}
  .lvlbar{top:-16px}
}
@media (max-width:1180px){
  .panes{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .pane{border-right:none;border-bottom:1px solid var(--line)}
  .pane:last-child{border-bottom:none}
}

function fmtImp(mm){
  const prec=mm/25.4<24?16:8;
  let u=Math.round(mm/25.4*prec);
  const neg=u<0;
  if(neg)u=-u;
  const per=prec*12;
  const ft=Math.floor(u/per);
  const rem=u%per;
  const whole=Math.floor(rem/prec);
  let n=rem%prec,d=prec;
  while(n&&n%2===0){n/=2;d/=2;}
  let inch=String(whole);
  if(n)inch=(whole?whole+' ':'')+n+'/'+d;
  let out;
  if(ft)out=ft+"'"+(rem?' '+inch+'"':'');
  else out=inch+'"';
  return (neg?'-':'')+out;
}
function fmtLen(mm){
  return UNITS==='imperial'?fmtImp(mm):Math.round(mm).toLocaleString('en-US')+' mm';
}
function fmtLenS(mm){
  return UNITS==='imperial'?fmtImp(mm):String(Math.round(mm));
}
function fmtTerms(terms,scale){
  const list=UNITS==='imperial'?terms.map(t=>(t/2.54).toFixed(1)).join(' · ')+' in':terms.join(' · ')+' cm';
  return list+' × '+scale.toFixed(3);
}

function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

function toPath(pts){

function offsetPaths(paths,d){

}

function arcPts(cx,cy,r,a0,a1){
  const n=Math.max(4,Math.ceil(Math.abs(a1-a0)/0.07));
  const o=[];
  for(let i=0;i<=n;i++){
    const a=a0+(a1-a0)*i/n;
    o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);
  }
  return o;
}
function circPts(cx,cy,r){
  const rr=Math.max(r,1);
  const n=Math.max(24,Math.min(120,Math.ceil(TAU/(2*Math.acos(Math.max(0,1-0.15/rr))||0.1))));
  const o=[];
  for(let i=0;i<n;i++){
    const a=TAU*i/n;
    o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);
  }
  return o;
}
function cCirc(cx,cy,r){return {k:'c',cx,cy,r};}
function cPt(x,y){return {k:'p',x,y};}
function cLn(x0,y0,x1,y1){return {k:'l',x0,y0,x1,y1};}
function shiftCons(cons,dx,dy){
  return cons.map(c=>{
    if(c.k==='c')return cCirc(c.cx+dx,c.cy+dy,c.r);
    if(c.k==='p')return cPt(c.x+dx,c.y+dy);
    return cLn(c.x0+dx,c.y0+dy,c.x1+dx,c.y1+dy);
  });
}
function mirrorLeft(L){
  return L.concat(L.slice(0,-1).map(p=>[-p[0],p[1]]).reverse());
}
function rightToFull(R){
  const L=R.map(p=>[-p[0],p[1]]);
  return mirrorLeft(L);
}
function normAngle(a){
  while(a>Math.PI)a-=TAU;
  while(a<=-Math.PI)a+=TAU;
  return a;
}
function resample(pts,n){
  const d=[0];
  for(let i=1;i<pts.length;i++)d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=d[d.length-1];
  const out=[];
  let j=0;
  for(let i=0;i<=n;i++){
    const t=tot*i/n;
    while(j<pts.length-2&&d[j+1]<t)j++;
    const seg=d[j+1]-d[j]||1;
    const u=Math.min(1,Math.max(0,(t-d[j])/seg));
    out.push([pts[j][0]+(pts[j+1][0]-pts[j][0])*u,pts[j][1]+(pts[j+1][1]-pts[j][1])*u]);
  }
  return out;
}

function headRound(h){
  return {pts:arcPts(0,0,h,Math.PI,0),cons:[cCirc(0,0,h),cPt(0,0),cLn(0,0,0,h)],rise:h,
    info:{name:'Semicircular',radii:[h],centers:1,apex:null}};
}
function headSegmental(h,rise){
  const r=Math.min(Math.max(rise,h*0.02),h*0.999);
  const R=(h*h+r*r)/(2*r);
  const cy=r-R;
  const a0=Math.atan2(-cy,-h),a1=Math.atan2(-cy,h);
  return {pts:arcPts(0,cy,R,a0,a1),cons:[cCirc(0,cy,R),cPt(0,cy),cLn(0,cy,-h,0),cLn(0,cy,h,0),cLn(0,cy,0,r)],rise:r,
    info:{name:'Segmental',radii:[R],centers:1,apex:null}};
}
function headHorseshoe(h,k){
  const kk=k;
  const a=Math.atan2(kk,h);
  const r=Math.hypot(h,kk);
  return {pts:arcPts(0,kk,r,Math.PI+a,-a),cons:[cCirc(0,kk,r),cPt(0,kk),cLn(0,kk,-h,0),cLn(0,kk,h,0),cLn(0,kk,0,kk+r)],rise:kk+r,
    info:{name:'Horseshoe',radii:[r],centers:1,apex:null,extra:'arc sweep '+Math.round((Math.PI+2*a)*180/Math.PI)+'°'}};
}
function pointedName(rho){
  if(rho<0.505)return 'Semicircular';
  if(rho<0.97)return 'Drop (obtuse) arch';
  if(rho<=1.03)return 'Equilateral arch';
  return 'Lancet (acute) arch';
}
function headPointed(h,rho){
  const rr=Math.max(rho,0.5);
  const R=rr*2*h;
  const ya=Math.sqrt(Math.max(0,2*R*h-h*h));
  const ta=Math.atan2(ya,h-R);
  const cxL=-h+R;
  const Lpts=arcPts(cxL,0,R,Math.PI,ta);
  return {pts:mirrorLeft(Lpts),
    cons:[cCirc(cxL,0,R),cCirc(-cxL,0,R),cPt(cxL,0),cPt(-cxL,0),cLn(cxL,0,0,ya),cLn(-cxL,0,0,ya),cLn(cxL,0,-h,0),cLn(-cxL,0,h,0)],
    rise:ya,
    info:{name:pointedName(rr),radii:[R,R],centers:rr<=0.505?1:2,apex:rr<=0.505?180:(2*Math.PI-2*ta)*180/Math.PI}};
}
function headTudor(h,span,S){
  const r1=S.r1*span,phi=S.phi*Math.PI/180,rise=Math.min(Math.max(S.rise*span,span*0.03),span*2);
  const Px=h-r1,Py=0;
  const Dx=-Px,Dy=rise;
  const ux=Math.cos(phi),uy=Math.sin(phi);
  const den=2*(Dx*ux+Dy*uy-r1);
  const t=(r1*r1-(Dx*Dx+Dy*Dy))/den;
  if(!isFinite(t)||t<=0)return null;
  const r2=t+r1;
  const Cx=Px-t*ux,Cy=Py-t*uy;
  const a1=Math.atan2(rise-Cy,0-Cx);
  if(!(a1>phi+0.01))return null;
  const small=arcPts(Px,Py,r1,0,phi);
  const large=arcPts(Cx,Cy,r2,phi,a1);
  const R=small.concat(large.slice(1));
  const jx=Px+r1*ux,jy=Py+r1*uy;
  return {pts:rightToFull(R),
    cons:[cCirc(Px,0,r1),cCirc(-Px,0,r1),cCirc(Cx,Cy,r2),cCirc(-Cx,Cy,r2),cPt(Px,0),cPt(-Px,0),cPt(Cx,Cy),cPt(-Cx,Cy),cLn(Cx,Cy,jx,jy),cLn(-Cx,Cy,-jx,jy),cLn(Cx,Cy,0,rise),cLn(-Cx,Cy,0,rise)],
    rise,
    info:{name:'Four-centred (Tudor)',radii:[r1,r2],centers:4,apex:null}};
}
function headOgee(h,span,S){
  const r1=S.r1*span,phi=S.phi*Math.PI/180,rise=Math.min(Math.max(S.rise*span,span*0.1),span*2);
  const Px=h-r1;
  const Dx=-Px,Dy=rise;
  const ux=Math.cos(phi),uy=Math.sin(phi);
  const den=2*(r1-(Dx*ux+Dy*uy));
  const s=(r1*r1-(Dx*Dx+Dy*Dy))/den;
  if(!isFinite(s)||s<=r1*1.0001)return null;
  const r2=s-r1;
  const Cx=Px+s*ux,Cy=s*uy;
  const a0=phi+Math.PI;
  const a1=a0+normAngle(Math.atan2(rise-Cy,0-Cx)-a0);
  if(Math.abs(a1-a0)<0.03||Math.abs(a1-a0)>3)return null;
  const convex=arcPts(Px,0,r1,0,phi);
  const concave=arcPts(Cx,Cy,r2,a0,a1);
  const R=convex.concat(concave.slice(1));
  const jx=Px+r1*ux,jy=r1*uy;
  return {pts:rightToFull(R),
    cons:[cCirc(Px,0,r1),cCirc(-Px,0,r1),cCirc(Cx,Cy,r2),cCirc(-Cx,Cy,r2),cPt(Px,0),cPt(-Px,0),cPt(Cx,Cy),cPt(-Cx,Cy),cLn(Px,0,Cx,Cy),cLn(-Px,0,-Cx,Cy),cLn(Cx,Cy,0,rise),cLn(-Cx,Cy,0,rise)],
    rise,
    info:{name:'Ogee',radii:[r1,r2],centers:4,apex:null}};
}
function headMultifoil(h,rho,N,bulge){
  const base=headPointed(h,rho);
  const P=resample(base.pts,N);
  const pts=[];
  const cons=[];
  for(let i=0;i<N;i++){
    const p0=P[i],p1=P[i+1];
    const dx=p1[0]-p0[0],dy=p1[1]-p0[1];
    const len=Math.hypot(dx,dy)||1;
    const c=len/2;
    const sag=bulge*c;
    const r=(c*c+sag*sag)/(2*sag);
    const nx=-dy/len,ny=dx/len;
    const mx=(p0[0]+p1[0])/2,my=(p0[1]+p1[1])/2;
    const cx=mx-(r-sag)*nx,cy=my-(r-sag)*ny;
    const a0=Math.atan2(p0[1]-cy,p0[0]-cx);
    const a1=Math.atan2(p1[1]-cy,p1[0]-cx);
    let d=a1-a0;
    while(d>0)d-=TAU;
    while(d<-TAU)d+=TAU;
    const arc=arcPts(cx,cy,r,a0,a0+d);
    arc.forEach((q,j)=>{if(i===0||j>0)pts.push(q);});
    cons.push(cCirc(cx,cy,r),cPt(cx,cy));
  }
  let rise=0;
  pts.forEach(p=>{if(p[1]>rise)rise=p[1];});
  return {pts,cons:cons.concat(base.pts.map((p,i)=>i%6===0?cPt(p[0],p[1]):null).filter(Boolean)),rise,
    info:{name:N===3?'Trefoil arch':'Multifoil arch ('+N+' lobes)',radii:[],centers:N,apex:null}};
}
function headEllipse(h,rise){
  const pts=[];
  for(let i=0;i<=64;i++){const t=Math.PI-Math.PI*i/64;pts.push([h*Math.cos(t),rise*Math.sin(t)]);}
  return {pts,cons:[cLn(0,0,0,rise),cLn(-h,0,h,0)],rise,info:{name:'Semi-ellipse',radii:[],centers:0,apex:null,extra:'semi-axes '+fmtLen(h)+' × '+fmtLen(rise)}};
}
function headParabola(h,rise){
  const pts=[];
  for(let i=0;i<=64;i++){const x=-h+2*h*i/64;pts.push([x,rise*(1-(x*x)/(h*h))]);}
  return {pts,cons:[cLn(0,0,0,rise)],rise,info:{name:'Parabolic',radii:[],centers:0,apex:null}};

function headCatenary(h,rise){
  let lo=h/700,hi=1e7;
  for(let i=0;i<90;i++){
    const mid=Math.sqrt(lo*hi);
    const f=mid*(Math.cosh(h/mid)-1);
    if(f>rise)lo=mid;else hi=mid;
  }
  const a=Math.sqrt(lo*hi);
  const pts=[];
  for(let i=0;i<=64;i++){const x=-h+2*h*i/64;pts.push([x,rise-a*(Math.cosh(x/a)-1)]);}
  return {pts,cons:[cLn(0,0,0,rise)],rise,info:{name:'Catenary',radii:[],centers:0,apex:null,extra:'chain parameter a = '+fmtLen(a)}};
}
function headFlat(h){
  return {pts:[[-h,0],[h,0]],cons:[],rise:0,info:{name:'Flat lintel',radii:[],centers:0,apex:null}};
}

function makeHead(S,h,span){
  switch(S.arch){
    case 'round':return headRound(h);
    case 'segmental':return headSegmental(h,S.rise*span);
    case 'horseshoe':return headHorseshoe(h,S.stilt*h);
    case 'pointed':return headPointed(h,S.rho);
    case 'tudor':return headTudor(h,span,S);
    case 'ogee':return headOgee(h,span,S);
    case 'multifoil':return headMultifoil(h,S.rho,Math.round(S.lobes),S.bulge);
    case 'ellipse':return headEllipse(h,Math.max(S.rise*span,span*0.03));
    case 'parabola':return headParabola(h,Math.max(S.rise*span,span*0.03));
    case 'catenary':return headCatenary(h,Math.max(S.rise*span,span*0.03));
    case 'flat':return headFlat(h);
    default:return headPointed(h,1);
  }
}

function buildOpening(S){
  const span=S.span,h=span/2;
  if(S.arch==='circle'){
    const pts=circPts(0,h,h);
    return {h,Ht:span,ys:h,rise:h,O:[toPath(pts)],pts,cons:[cCirc(0,h,h),cPt(0,h),cLn(-h,h,h,h),cLn(0,0,0,span)],
      info:{name:'Circular',radii:[h],centers:1,apex:null},circle:{x:0,y:h,r:h},warn:null};
  }
  let warn=null;
  let head=makeHead(S,h,span);
  if(!head){
    head=headPointed(h,1);
    warn='Parameters out of range for this head — showing an equilateral arch instead.';
  }
  let ys=S.arch==='flat'?S.height:S.height-head.rise;
  const minYs=span*0.05;
  if(ys<minYs){
    ys=minYs;
    warn='Height is too low for this head — raised to fit.';
  }
  const Ht=ys+head.rise;
  const hp=head.pts.map(p=>[p[0],p[1]+ys]);
  const poly=[[-h,0]].concat(hp).concat([[h,0]]);
  const cons=shiftCons(head.cons,0,ys);
  cons.push(cLn(-h,ys,h,ys));
  return {h,Ht,ys,rise:head.rise,O:[toPath(poly)],pts:poly,cons,info:head.info,circle:null,warn};
}

function isMod(sch){return sch==='modBlue'||sch==='modRed';}
function weights(n,sch){
  const w=[];
  for(let i=0;i<n;i++){
    if(sch==='golden')w.push(Math.pow(PHI,i));
    else if(sch==='fibonacci')w.push(FIB[Math.min(i,FIB.length-1)]);
    else w.push(1);
  }
  return w;
}
function modTerms(n,series,L,mirror){
  const T=series==='red'?RED:BLUE;
  const mir=!!mirror&&n>1;
  const k=mir?Math.ceil(n/2):n;
  const build=a=>mir?(n%2===0?a.concat(a.slice().reverse()):a.concat(a.slice(0,k-1).reverse())):a;
  let best=null;
  for(let i=0;i+k<=T.length;i++){
    const t=build(T.slice(i,i+k));
    const sum=t.reduce((a,b)=>a+b,0)*10;
    const err=Math.abs(sum-L)/L;
    if(!best||err<best.err)best={terms:t,err,sum,start:i};
  }
  if(!best){
    const t=build(T.slice(Math.max(0,T.length-k)));
    best={terms:t,err:1,sum:t.reduce((a,b)=>a+b,0)*10,start:0};
  }
  best.scale=L/best.sum;
  return best;
}
function division(n,sch,sym,L){
  let w;
  if(isMod(sch))w=modTerms(n,sch==='modRed'?'red':'blue',L||1000,sym).terms;
  else if(sym&&n>1){
    const half=Math.ceil(n/2);
    const w0=weights(half,sch);
    w=n%2===0?w0.concat(w0.slice().reverse()):w0.concat(w0.slice(0,half-1).reverse());
  }else w=weights(n,sch);
  const tot=w.reduce((a,b)=>a+b,0);
  const b=[0];
  w.forEach(x=>b.push(b[b.length-1]+x/tot));
  return b;
}

function foilPaths(cx,cy,R,n){
  const s=Math.sin(Math.PI/n);
  let rf=R*s/(1+s)*(1+FOIL_OV);
  rf=Math.min(rf,R*0.92);
  const d=R-rf;
  const polys=[];
  const cs=[];
  for(let k=0;k<n;k++){
    const a=Math.PI/2+TAU*k/n;
    const px=cx+d*Math.cos(a),py=cy+d*Math.sin(a);
    cs.push([px,py]);
    polys.push(toPath(circPts(px,py,rf)));
  }
  polys.push(toPath(cs));
  return boolOp(polys,[],CL.ClipType.ctUnion);
}
function circleCell(cx,cy,r,foilN){
  if(foilN>=3)return foilPaths(cx,cy,r,foilN);
  return [toPath(circPts(cx,cy,r))];
}

function pack(F,K,minR){
  const E=[];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  F.forEach(p=>{
    for(let i=0;i<p.length;i++){
      const a=p[i],b=p[(i+1)%p.length];
      const ax=a.X/SC,ay=a.Y/SC,bx=b.X/SC,by=b.Y/SC;
      E.push(ax,ay,bx,by);
      if(ax<x0)x0=ax;if(ax>x1)x1=ax;if(ay<y0)y0=ay;if(ay>y1)y1=ay;
    }
  });
  const out=[];
  if(!E.length||K<=0)return out;
  const ne=E.length/4;
  function inside(x,y){
    let c=false;
    for(let i=0;i<ne;i++){
      const j=i*4;
      const ay=E[j+1],by=E[j+3];
      if((ay>y)!==(by>y)){
        const ax=E[j],bx=E[j+2];
        if(x<ax+(y-ay)*(bx-ax)/(by-ay))c=!c;
      }
    }
    return c;
  }
  function dEdge(x,y){
    let m=1e18;
    for(let i=0;i<ne;i++){
      const j=i*4;
      const ax=E[j],ay=E[j+1],dx=E[j+2]-ax,dy=E[j+3]-ay;
      const l2=dx*dx+dy*dy;
      let t=l2?((x-ax)*dx+(y-ay)*dy)/l2:0;
      t=t<0?0:t>1?1:t;
      const ex=ax+t*dx-x,ey=ay+t*dy-y;
      const d=ex*ex+ey*ey;
      if(d<m)m=d;
    }
    return Math.sqrt(m);
  }
  function dist(x,y){
    if(!inside(x,y))return -1;
    let d=dEdge(x,y);
    for(let i=0;i<out.length;i++){
      const e=Math.hypot(x-out[i].x,y-out[i].y)-out[i].r;
      if(e<d)d=e;
    }
    return d;
  }
  const step=Math.max(8,Math.max(x1-x0,y1-y0)/90);
  const m=Math.max(Math.abs(x0),Math.abs(x1));
  const nx=2*Math.floor(m/step)+1;
  const ny=Math.floor((y1-y0)/step)+1;
  const gx=new Float32Array(nx*ny),gy=new Float32Array(nx*ny),gd=new Float32Array(nx*ny);
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const id=j*nx+i;
    const x=(i-(nx-1)/2)*step,y=y0+j*step;
    gx[id]=x;gy[id]=y;
    gd[id]=inside(x,y)?dEdge(x,y):-1;
  }
  for(let k=0;k<K;k++){
    let bi=-1,bv=minR;
    for(let id=0;id<gd.length;id++){
      if(gd[id]>bv){bv=gd[id];bi=id;}
    }
    if(bi<0)break;
    let bx=gx[bi],by=gy[bi],bd=dist(bx,by);
    let st=step*0.5;
    for(let it=0;it<60&&st>0.15;it++){
      let imp=false;
      for(let a=0;a<8;a++){
        const cx=bx+st*Math.cos(a*Math.PI/4),cy=by+st*Math.sin(a*Math.PI/4);
        const d=dist(cx,cy);
        if(d>bd+1e-6){bd=d;bx=cx;by=cy;imp=true;}
      }
      if(!imp)st*=0.6;
    }
    if(bd<minR)break;
    out.push({x:bx,y:by,r:bd});
    for(let id=0;id<gd.length;id++){
      if(gd[id]>=0){
        const e=Math.hypot(gx[id]-bx,gy[id]-by)-bd;
        if(e<gd[id])gd[id]=e;
      }
    }
  }
  return out;
}

function rectPath(x0,y0,x1,y1){
  return toPath([[x0,y0],[x1,y0],[x1,y1],[x0,y1]]);
}

function cellsMullions(S,op){
  const b=division(Math.round(S.lights),S.scheme,S.sym,op.h*2);
  const cells=[];
  const cons=[];
  for(let i=0;i<b.length-1;i++){
    const xa=-op.h+2*op.h*b[i],xb=-op.h+2*op.h*b[i+1];
    cells.push(boolOp(op.O,[rectPath(xa,-100,xb,op.Ht+100)],CL.ClipType.ctIntersection));
    if(i>0)cons.push(cLn(xa,0,xa,op.Ht));
  }
  return {cells,cons,notes:[]};
}

function subHead(hs,S){
  if(S.subFoils>=3)return headMultifoil(hs,S.subRho,Math.round(S.subFoils),S.subBulge);
  return headPointed(hs,S.subRho);
}

function cellsGeometric(S,op,hw,fi){
  const n=Math.round(S.lights);
  const b=division(n,S.scheme,S.sym,op.h*2);
  const cells=[];
  let cons=[];
  const ysub=op.ys*S.subSpring;
  for(let i=0;i<n;i++){
    const xa=-op.h+2*op.h*b[i],xb=-op.h+2*op.h*b[i+1];
    const hs=(xb-xa)/2,cx=(xa+xb)/2;
    const head=subHead(hs,S);
    const poly=[[cx-hs,0]].concat(head.pts.map(p=>[p[0]+cx,p[1]+ysub])).concat([[cx+hs,0]]);
    cells.push(boolOp([toPath(poly)],[rectPath(xa,-100,xb,op.Ht+100)],CL.ClipType.ctIntersection));
    cons=cons.concat(shiftCons(head.cons,cx,ysub));
    cons.push(cLn(cx-hs,ysub,cx+hs,ysub));
  }
  const notes=[];
  if(S.circles>0){
    const free=boolOp(offsetPaths(op.O,-fi),[].concat.apply([],cells),CL.ClipType.ctDifference);
    const cs=pack(free,Math.round(S.circles),S.minR);
    const fn=S.foilN>=3?Math.round(S.foilN):0;
    cs.forEach(c=>{
      cells.push(circleCell(c.x,c.y,c.r,fn));
      cons.push(cCirc(c.x,c.y,c.r),cPt(c.x,c.y));
    });
    if(cs.length)notes.push(['Packed circles',cs.length+' · r '+cs.slice(0,3).map(c=>(c.r/S.span).toFixed(3)).join(', ')+' × span']);
  }
  return {cells,cons,notes};
}

function cellsRose(S,op,hw,fi){
  const inset=offsetPaths(op.O,-fi);
  let C;
  if(op.circle)C={x:0,y:op.circle.y,r:op.circle.r-fi};
  else{
    const c=pack(inset,1,10)[0];
    C=c||{x:0,y:op.Ht/2,r:op.h*0.5};
  }
  const n=Math.round(S.petals);
  const cells=[];
  const cons=[cCirc(C.x,C.y,C.r),cPt(C.x,C.y)];
  const notes=[];
  if(S.roseStyle==='wheel'){
    const r0=C.r*0.2;
    for(let k=0;k<n;k++){
      const a0=Math.PI/2+TAU*k/n,a1=Math.PI/2+TAU*(k+1)/n;
      const inner=arcPts(C.x,C.y,r0,a0,a1);
      const outer=arcPts(C.x,C.y,C.r,a1,a0);
      cells.push([toPath(inner.concat(outer))]);
      cons.push(cLn(C.x+r0*Math.cos(a0),C.y+r0*Math.sin(a0),C.x+C.r*Math.cos(a0),C.y+C.r*Math.sin(a0)));
    }
    cons.push(cCirc(C.x,C.y,r0));
    notes.push(['Hub radius','0.20 × rose radius']);
    return {cells,cons,notes};
  }
  const fn=S.foilN>=3?Math.round(S.foilN):0;
  const sp=Math.sin(Math.PI/n);
  const rp=C.r*sp/(1+sp);
  const d=C.r-rp;
  const rh=d-rp;
  for(let k=0;k<n;k++){
    const a=Math.PI/2+TAU*k/n;
    const px=C.x+d*Math.cos(a),py=C.y+d*Math.sin(a);
    cells.push(circleCell(px,py,rp,fn));
    cons.push(cCirc(px,py,rp),cPt(px,py));
  }
  if(rh>8){
    cells.push(circleCell(C.x,C.y,rh,fn));
    cons.push(cCirc(C.x,C.y,rh));
  }
  notes.push(['Petal radius','r = R·sin(π/n) ÷ (1+sin(π/n)) = '+(rp/C.r).toFixed(3)+' R']);
  if(S.circles>0){
    const free=boolOp(inset,[].concat.apply([],cells),CL.ClipType.ctDifference);
    const cs=pack(free,Math.round(S.circles),S.minR);
    cs.forEach(c=>{
      cells.push(circleCell(c.x,c.y,c.r,fn));
      cons.push(cCirc(c.x,c.y,c.r),cPt(c.x,c.y));
    });
    if(cs.length)notes.push(['Packed circles',String(cs.length)]);
  }
  return {cells,cons,notes};
}

function cellsGrid(S,op){
  const cols=Math.round(S.cols),rows=Math.round(S.rows);
  const bx=division(cols,S.scheme,S.sym,op.h*2),by=division(rows,S.rowScheme,S.sym,op.Ht);
  const rng=mulberry32(Math.round(S.seed)*7919);
  const p1=rng()*TAU,p2=rng()*TAU,p3=rng()*TAU,p4=rng()*TAU;
  const crng=mulberry32(Math.round(S.seed)*613+29);
  const pool=[0,0,0,0,1,2,3];
  const A=S.warp,L=S.warpLen;
  function warp(x,y){
    if(A<=0)return [x,y];
    const dx=A*(0.7*Math.sin(TAU*y/L+p1)+0.3*Math.sin(TAU*y/(L*0.43)+p2));
    const dy=A*0.6*(0.7*Math.sin(TAU*x/(L*0.8)+p3)+0.3*Math.sin(TAU*x/(L*0.37)+p4));
    return [x+dx,y+dy];
  }
  const X=bx.map(t=>-op.h+2*op.h*t),Y=by.map(t=>op.Ht*t);
  const sub=A>0?14:1;
  const cells=[],colors=[];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const x0=X[i],x1=X[i+1],y0=Y[j],y1=Y[j+1];
    const pts=[];
    for(let q=0;q<sub;q++)pts.push(warp(x0+(x1-x0)*q/sub,y0));
    for(let q=0;q<sub;q++)pts.push(warp(x1,y0+(y1-y0)*q/sub));
    for(let q=0;q<sub;q++)pts.push(warp(x1-(x1-x0)*q/sub,y1));
    for(let q=0;q<sub;q++)pts.push(warp(x0,y1-(y1-y0)*q/sub));
    const cell=boolOp([toPath(pts)],op.O,CL.ClipType.ctIntersection);
    if(cell.length){cells.push(cell);colors.push(CORB_PAL[pool[Math.floor(crng()*pool.length)]]);}
  }
  const notes=[['Grid',cols+' × '+rows]];
  if(isMod(S.scheme)){
    const t=modTerms(cols,S.scheme==='modRed'?'red':'blue',op.h*2,S.sym);
    notes.push(['Columns',fmtTerms(t.terms,t.scale)]);
  }
  if(isMod(S.rowScheme)){
    const t=modTerms(rows,S.rowScheme==='modRed'?'red':'blue',op.Ht,S.sym);
    notes.push(['Rows',fmtTerms(t.terms,t.scale)]);
  }
  return {cells,cons:[],notes,colors:S.polychrome?colors:null};
}

function mondrianBuild(W,H,seed,splits){
  const rng=mulberry32(Math.round(seed)*104729+17);
  const minD=Math.min(W,H)*0.09;
  const RAT=[1/4,1/3,2/5,3/5,2/3,3/4];
  const rects=[{x0:0,y0:0,x1:W,y1:H}];
  const segs=[];
  for(let n=0;n<splits;n++){
    const cand=[];
    rects.forEach((r,i)=>{
      const w=r.x1-r.x0,h=r.y1-r.y0;
      if(w>=minD*2.2||h>=minD*2.2)cand.push({i,w,h});
    });
    if(!cand.length)break;
    const wts=cand.map(c=>Math.pow(c.w*c.h,1.5));
    const tot=wts.reduce((a,b)=>a+b,0);
    let t=rng()*tot,pick=cand[0];
    for(let j=0;j<cand.length;j++){t-=wts[j];if(t<=0){pick=cand[j];break;}}
    const r=rects[pick.i];
    let vert;
    if(pick.w<minD*2.2)vert=false;
    else if(pick.h<minD*2.2)vert=true;
    else if(pick.w/pick.h>1.25)vert=true;
    else if(pick.h/pick.w>1.25)vert=false;
    else vert=rng()<0.5;
    for(let tries=0;tries<8;tries++){
      const f=RAT[Math.floor(rng()*RAT.length)];
      if(vert){
        const x=r.x0+(r.x1-r.x0)*f;
        if(x-r.x0<minD||r.x1-x<minD)continue;
        segs.push({o:'v',pos:x,a:r.y0,b:r.y1});
        rects.splice(pick.i,1,{x0:r.x0,y0:r.y0,x1:x,y1:r.y1},{x0:x,y0:r.y0,x1:r.x1,y1:r.y1});
      }else{
        const y=r.y0+(r.y1-r.y0)*f;
        if(y-r.y0<minD||r.y1-y<minD)continue;
        segs.push({o:'h',pos:y,a:r.x0,b:r.x1});
        rects.splice(pick.i,1,{x0:r.x0,y0:r.y0,x1:r.x1,y1:y},{x0:r.x0,y0:y,x1:r.x1,y1:r.y1});
      }
      break;
    }
  }
  const order=rects.map((r,i)=>({i,a:(r.x1-r.x0)*(r.y1-r.y0)})).sort((p,q)=>p.a-q.a).map(o=>o.i);
  const col=rects.map(()=> 'W');
  const used=new Set();
  const cnt=order.length;
  function take(lo,hi,key){
    const a=Math.floor(cnt*lo),b=Math.max(a+1,Math.floor(cnt*hi));
    let pool=order.slice(a,b).filter(i=>!used.has(i));
    if(!pool.length)pool=order.filter(i=>!used.has(i));
    if(!pool.length)return;
    const i=pool[Math.floor(rng()*pool.length)];
    used.add(i);
    col[i]=key;
  }
  if(cnt>=3){take(0.5,0.95,'R');take(0.1,0.6,'B');take(0,0.5,'Y');}
  if(cnt>=8&&rng()<0.6)take(0,0.35,'K');
  return {rects:rects.map((r,i)=>Object.assign({color:col[i]},r)),segs};
}

function cellsMondrian(S,op){
  const m=mondrianBuild(op.h*2,op.Ht,S.mondSeed,Math.round(S.mondSplits));
  const cells=[],colors=[];
  m.rects.forEach(r=>{
    const cell=boolOp(op.O,[rectPath(r.x0-op.h,r.y0,r.x1-op.h,r.y1)],CL.ClipType.ctIntersection);
    if(cell.length){cells.push(cell);colors.push(MOND_PAL[r.color]);}
  });
  return {cells,cons:[],notes:[['Composition',m.rects.length+' fields · seed '+Math.round(S.mondSeed)]],colors,barColor:MOND_PAL.K};
}

function lightColor(sh,cells,colors){
  const c=sh.outer;
  let a=0,cx=0,cy=0;
  for(let i=0;i<c.length;i++){
    const p=c[i],q=c[(i+1)%c.length];
    const cr=p.X*q.Y-q.X*p.Y;
    a+=cr;cx+=(p.X+q.X)*cr;cy+=(p.Y+q.Y)*cr;
  }
  const tries=[];
  if(Math.abs(a)>1)tries.push({X:Math.round(cx/(3*a)),Y:Math.round(cy/(3*a))});
  tries.push({X:c[0].X,Y:c[0].Y});
  for(let t=0;t<tries.length;t++){
    for(let i=0;i<cells.length;i++)for(let j=0;j<cells[i].length;j++){
      if(CL.Clipper.PointInPolygon(tries[t],cells[i][j])!==0)return colors[i];
    }
  }
  return null;
}

function cellsLattice(S,op){
  let p=S.pitch;
  const W=op.h*2;
  while((W*op.Ht)/(p*p)>420)p*=1.1;
  const cx0=0,cy0=op.Ht/2;
  const rot=S.rot*Math.PI/180,cs=Math.cos(rot),sn=Math.sin(rot);
  const R=Math.hypot(op.h,op.Ht/2)+p*2;
  const N=Math.ceil(R/p)+2;
  const raw=[];
  const sqrt2=Math.SQRT2;
  const n=Math.round(S.starPts);
  function ngon(cx,cy,r,k,a0){
    const o=[];
    for(let i=0;i<k;i++){const a=a0+TAU*i/k;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
    return o;
  }
  function starShape(cx,cy,ro,ri,k){
    const o=[];
    for(let i=0;i<k*2;i++){
      const a=Math.PI/2+Math.PI*i/k;
      const r=i%2===0?ro:ri;
      o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);
    }
    return o;
  }
  const hexR=p/Math.sqrt(3);
  for(let j=-N;j<=N;j++)for(let i=-N;i<=N;i++){
    if(S.latCell==='square'){
      const x=i*p,y=j*p;
      raw.push([[x-p/2,y-p/2],[x+p/2,y-p/2],[x+p/2,y+p/2],[x-p/2,y+p/2]]);
    }else if(S.latCell==='hexagon'){
      const x=i*p+(((j%2)+2)%2?p/2:0),y=j*1.5*hexR;
      raw.push(ngon(x,y,hexR,6,Math.PI/2));
    }else if(S.latCell==='octagon'){
      const x=i*p,y=j*p;
      raw.push(ngon(x,y,p/(2*Math.cos(Math.PI/8)),8,Math.PI/8));
      const a=p/(1+sqrt2);
      raw.push(ngon(x+p/2,y+p/2,a/sqrt2,4,0));
    }else{
      const x=i*p,y=j*p;
      const ro=p/2*(n%4===0?1:0.96);
      raw.push(starShape(x,y,ro,ro*S.starDepth,n));
      if(S.dual)raw.push(ngon(x+p/2,y+p/2,p*0.26,4,0));
    }
  }
  const cells=[];
  raw.forEach(poly=>{
    const t=poly.map(q=>[cx0+q[0]*cs-q[1]*sn,cy0+q[0]*sn+q[1]*cs]);
    let mx=0,my=0;
    t.forEach(q=>{mx+=q[0];my+=q[1];});
    mx/=t.length;my/=t.length;
    if(Math.abs(mx)>op.h+p*0.6||my<-p*0.6||my>op.Ht+p*0.6)return;
    const cell=boolOp([toPath(t)],op.O,CL.ClipType.ctIntersection);
    if(cell.length)cells.push(cell);
  });
  return {cells,cons:[],notes:[['Lattice pitch',fmtLen(p)],['Cells',String(cells.length)]]};
}

function treeShapes(tree){
  const out=[];
  function go(n){
    out.push({outer:n.Contour(),holes:n.Childs().map(h=>h.Contour())});
    n.Childs().forEach(h=>h.Childs().forEach(go));
  }
  tree.Childs().forEach(go);
  return out;
}

function compute(S){
  const op=buildOpening(S);
  const hw=S.bar/2;
  const fEff=Math.max(S.frame,hw);
  const fi=fEff-hw;
  let r;
  switch(S.pattern){
    case 'mullions':r=cellsMullions(S,op);break;
    case 'geometric':r=cellsGeometric(S,op,hw,fi);break;
    case 'rose':r=cellsRose(S,op,hw,fi);break;
    case 'grid':r=cellsGrid(S,op);break;
    case 'mondrian':r=cellsMondrian(S,op);break;
    case 'lattice':r=cellsLattice(S,op);break;
    default:r={cells:[op.O],cons:[],notes:[]};
  }
  const lightsRaw=[];
  r.cells.forEach(cp=>{
    offsetPaths(cp,-hw).forEach(p=>lightsRaw.push(p));
  });
  const insetO=offsetPaths(op.O,-fEff);
  let lights=boolOp(lightsRaw,insetO,CL.ClipType.ctIntersection);
  const minA=hw*hw;
  lights=lights.filter(p=>{
    const a=CL.Clipper.Area(p)/(SC*SC);
    return a<0||a>minA;
  });
  const m=S.margin;
  const rect={x0:-op.h-m,y0:-m,x1:op.h+m,y1:op.Ht+m};
  if(S.arch==='horseshoe'){
    let ext=op.h;
    op.pts.forEach(p=>{if(Math.abs(p[0])>ext)ext=Math.abs(p[0]);});
    rect.x0=-ext-m;rect.x1=ext+m;
  }
  const rectP=rectPath(rect.x0,rect.y0,rect.x1,rect.y1);
  const tracery=boolOp(op.O,lights,CL.ClipType.ctDifference);
  const surround=boolOp([rectP],op.O,CL.ClipType.ctDifference);
  const lightTree=boolTree(lights,[],CL.ClipType.ctUnion);
  const lightShapes=treeShapes(lightTree);
  const lightColors=r.colors?lightShapes.map(sh=>lightColor(sh,r.cells,r.colors)):null;
  const aO=areaMM2(op.O),aL=areaMM2(lights);
  return {op,lights,lightShapes,lightColors,barColor:r.barColor||null,tracery,surround,rect,cons:op.cons.concat(r.cons),notes:r.notes,
    glaze:aO>0?aL/aO:0,nLights:lightShapes.length,hw,fEff,tracTree:boolTree(op.O,lights,CL.ClipType.ctDifference),surTree:boolTree([rectP],op.O,CL.ClipType.ctDifference),
    Ht:op.Ht,warn:op.warn||(lightShapes.length?null:'No lights remain — bars are wider than the cells. Reduce bar width or enlarge the pattern.')};
}

function analysisHtml(){
  const op=G.op,span=S.span;
  const rows=[];
  const kv=(a,b,cls)=>rows.push(`<div class="kv${cls?' '+cls:''}"><span>${escapeHtml(a)}</span><span>${escapeHtml(b)}</span></div>`);
  kv('Head',op.info.name);
  kv('Span',fmtLen(span));
  if(S.arch!=='circle'){
    kv('Rise',fmtLen(op.rise));
    kv('Rise ÷ span',(op.rise/span).toFixed(3));
    kv('Springing height',fmtLen(op.ys));
    kv('Total height',fmtLen(op.Ht));
  }
  if(op.info.centers)kv('Centres',String(op.info.centers));
  if(op.info.radii&&op.info.radii.length){
    const u=Array.from(new Set(op.info.radii.map(r=>(r/span).toFixed(3))));
    kv('Radii ÷ span',u.join(' · '));
  }
  if(op.info.apex)kv('Apex angle',op.info.apex.toFixed(1)+'°');
  if(op.info.extra)kv('Detail',op.info.extra);
  kv('Lights',String(G.nLights));
  kv('Glazing ratio',(G.glaze*100).toFixed(1)+'%');
  kv('Bar · frame',fmtLen(S.bar)+' · '+fmtLen(G.fEff));
  G.notes.forEach(n=>kv(n[0],n[1]));
  if(G.warn)kv('Notice',G.warn,'warn');
  let html=rows.join('');
  html+=`<div class="note">${escapeHtml(ARCH_NOTES[S.arch]||'')}</div>`;
  return html;
}

function tracePaths(x,paths){
  paths.forEach(p=>{
    if(!p.length)return;
    x.moveTo(p[0].X/SC,p[0].Y/SC);
    for(let i=1;i<p.length;i++)x.lineTo(p[i].X/SC,p[i].Y/SC);
    x.closePath();
  });
}

function fitView(w,h){
  const rw=G.rect.x1-G.rect.x0+260,rh=G.rect.y1-G.rect.y0+420;
  view.k=Math.min(w*0.92/rw,h*0.9/rh);
  view.x=0;view.y=0;
}

const STAIN=['#c0392b','#2e6bb5','#c9922b','#2f8f5b','#7a3fa0','#c2562e','#2a9aa8','#b5367a'];

function draw2D(){
  dirty2d=false;
  if(!G)return;
  const w=stage2d.clientWidth,h=stage2d.clientHeight;
  if(!w||!h)return;
  const dpr=window.devicePixelRatio||1;
  const c=cv2d;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){
    c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
    c.style.width=w+'px';c.style.height=h+'px';
  }
  const x=c.getContext('2d');
  const cs=getComputedStyle(document.documentElement);
  const col=n=>cs.getPropertyValue(n).trim();
  if(view.fit)fitView(w,h);
  const k=view.k;
  const tx=w/2+view.x,ty=h/2+view.y+k*G.Ht/2;
  x.setTransform(1,0,0,1,0,0);
  x.clearRect(0,0,c.width,c.height);
  x.setTransform(dpr*k,0,0,-dpr*k,dpr*tx,dpr*ty);
  const R=G.rect;
  if(S.lyStone){
    x.fillStyle=col('--stone');
    x.fillRect(R.x0,R.y0,R.x1-R.x0,R.y1-R.y0);
  }else{
    x.strokeStyle=col('--line');
    x.lineWidth=1/k;
    x.strokeRect(R.x0,R.y0,R.x1-R.x0,R.y1-R.y0);
  }
  if(S.lyStone&&S.stained&&G.barColor){
    x.beginPath();
    tracePaths(x,G.tracery);
    x.fillStyle=G.barColor;
    x.fill('evenodd');
  }
  if(S.lyGlass){
    if(S.stained){
      G.lightShapes.forEach((s,i)=>{
        const lc=G.lightColors&&G.lightColors[i];
        x.beginPath();
        tracePaths(x,[s.outer].concat(s.holes));
        x.fillStyle=(lc||STAIN[i%STAIN.length])+(lc?'E6':'88');
        x.fill('evenodd');
      });
    }else{
      x.beginPath();
      tracePaths(x,G.lights);
      x.fillStyle=col('--glass');
      x.fill('evenodd');
    }
  }else{
    x.beginPath();
    tracePaths(x,G.lights);
    x.fillStyle=col('--paper');
    x.fill('evenodd');
  }
  x.beginPath();
  tracePaths(x,G.lights);
  x.strokeStyle=col('--ink');
  x.globalAlpha=0.7;
  x.lineWidth=1.3/k;
  x.stroke();
  x.globalAlpha=1;
  x.beginPath();
  tracePaths(x,G.op.O);
  x.strokeStyle=col('--accent');
  x.lineWidth=2/k;
  x.stroke();
  if(S.lyCons){
    x.strokeStyle=col('--cons');
    x.fillStyle=col('--cons');
    x.lineWidth=1/k;
    x.setLineDash([5/k,4/k]);
    x.globalAlpha=0.65;
    G.cons.forEach(o=>{
      if(o.k==='c'){x.beginPath();x.arc(o.cx,o.cy,o.r,0,TAU);x.stroke();}
      else if(o.k==='l'){x.beginPath();x.moveTo(o.x0,o.y0);x.lineTo(o.x1,o.y1);x.stroke();}
    });
    x.setLineDash([]);
    x.globalAlpha=0.95;
    G.cons.forEach(o=>{
      if(o.k==='p'){x.beginPath();x.arc(o.x,o.y,3/k,0,TAU);x.fill();}
    });
    x.globalAlpha=1;
  }
  x.setTransform(dpr,0,0,dpr,0,0);
  if(S.lyDims){
    const P=(px,py)=>[tx+k*px,ty-k*py];
    const op=G.op;
    x.strokeStyle=col('--dim');
    x.fillStyle=col('--dim');
    x.lineWidth=1;
    x.font='11px "Space Mono",monospace';
    x.textAlign='center';
    const y0=P(0,R.y0)[1]+22;
    const a=P(-op.h,0)[0],b=P(op.h,0)[0];
    x.beginPath();x.moveTo(a,y0);x.lineTo(b,y0);x.moveTo(a,y0-5);x.lineTo(a,y0+5);x.moveTo(b,y0-5);x.lineTo(b,y0+5);x.stroke();
    x.fillText('span '+fmtLenS(S.span),(a+b)/2,y0+15);
    const xr=P(R.x1,0)[0]+22;
    const ya=P(0,0)[1],yb=P(0,op.Ht)[1];
    x.beginPath();x.moveTo(xr,ya);x.lineTo(xr,yb);x.moveTo(xr-5,ya);x.lineTo(xr+5,ya);x.moveTo(xr-5,yb);x.lineTo(xr+5,yb);x.stroke();
    x.save();x.translate(xr+15,(ya+yb)/2);x.rotate(-Math.PI/2);x.fillText('height '+fmtLenS(op.Ht),0,0);x.restore();
    if(S.arch!=='circle'&&S.arch!=='flat'){
      const ys=P(0,op.ys)[1],xl=P(R.x0,0)[0]-22;
      x.beginPath();x.moveTo(xl,ys);x.lineTo(xl,yb);x.moveTo(xl-5,ys);x.lineTo(xl+5,ys);x.moveTo(xl-5,yb);x.lineTo(xl+5,yb);x.stroke();
      x.save();x.translate(xl-8,(ys+yb)/2);x.rotate(-Math.PI/2);x.fillText('rise '+fmtLenS(op.rise),0,0);x.restore();
    }
  }
}

function polyShape(outer,holes){
  const sh=new THREE.Shape(outer.map(q=>new THREE.Vector2(q.X/SC,q.Y/SC)));
  holes.forEach(h=>sh.holes.push(new THREE.Path(h.map(q=>new THREE.Vector2(q.X/SC,q.Y/SC)))));
  return sh;
}

function solidGeo(shapes,D,b){
  let bb=Math.min(b,D/2.5);
  if(bb<0.5)bb=0;
  const geo=new THREE.ExtrudeGeometry(shapes,{depth:Math.max(D-2*bb,1),bevelEnabled:bb>0,bevelThickness:bb,bevelSize:bb,bevelOffset:-bb,bevelSegments:1,curveSegments:1,steps:1});
  geo.translate(0,0,bb);
  return geo;
}

function solid(shapes,D,b,mat){
  const geo=solidGeo(shapes,D,b);
  const m=new THREE.Mesh(geo,mat);
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}

function secCut(){
  const ext=Math.max(Math.abs(G.rect.x0),Math.abs(G.rect.x1));
  return Math.max(-ext,Math.min(ext,S.secX));
}

function sectionIntervals(paths,x){
  const strip=rectPath(x-0.5,-100000,x+0.5,100000);
  const r=boolOp(paths,[strip],CL.ClipType.ctIntersection);
  const iv=[];
  r.forEach(p=>{
    if(CL.Clipper.Area(p)<0)return;
    let lo=1e18,hi=-1e18;
    p.forEach(q=>{const y=q.Y/SC;if(y<lo)lo=y;if(y>hi)hi=y;});
    if(hi>lo)iv.push([lo,hi]);
  });
  iv.sort((a,b)=>a[0]-b[0]);
  const m=[];
  iv.forEach(v=>{
    if(m.length&&v[0]-m[m.length-1][1]<0.6)m[m.length-1][1]=Math.max(m[m.length-1][1],v[1]);
    else m.push([v[0],v[1]]);
  });
  return m;
}

function capMesh(y0,y1,z0,z1,b,color,x,lineMat){
  const bb=Math.max(0,Math.min(b,(y1-y0)/2.5,(z1-z0)/2.5));
  const pts=bb>0.4?[[z0+bb,y0],[z1-bb,y0],[z1,y0+bb],[z1,y1-bb],[z1-bb,y1],[z0+bb,y1],[z0,y1-bb],[z0,y0+bb]]:[[z0,y0],[z1,y0],[z1,y1],[z0,y1]];
  const geo=new THREE.ShapeGeometry(new THREE.Shape(pts.map(q=>new THREE.Vector2(q[0],q[1]))));
  geo.rotateY(-Math.PI/2);
  geo.translate(x,0,0);
  const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:new THREE.Color(color),side:THREE.DoubleSide}));
  const line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts.map(q=>new THREE.Vector3(x+0.6,q[1],q[0]))),lineMat);
  return [mesh,line];
}

function disposeGroup(){
  if(!group)return;
  while(group.children.length){
    const o=group.children.pop();
    if(o.geometry)o.geometry.dispose();
    if(o.material&&o.material.dispose&&!o.userData.sharedMat)o.material.dispose();
  }
}

function build3D(){
  dirty3d=false;
  if(!G)return;
  if(!renderer)return;
  disposeGroup();
  const cutX=secCut();
  const clip=S.secOn?[new THREE.Plane(new THREE.Vector3(-1,0,0),cutX)]:[];
  const stoneMat=new THREE.MeshStandardMaterial({color:0xc9bfa8,roughness:0.92,metalness:0,wireframe:S.wire,clippingPlanes:clip,clipShadows:true});
  const hw=G.hw;
  const cham=Math.min(S.chamfer,hw*0.45);
  const wallShapes=G.surTree.Childs().length?treeShapes(G.surTree).map(s=>polyShape(s.outer,s.holes)):[];
  const tracShapes=treeShapes(G.tracTree).map(s=>polyShape(s.outer,s.holes));
  const E=S.explode;
  const wallD=S.wallDepth;
  const wall=solid(wallShapes,wallD,S.chamfer,stoneMat);
  wall.position.z=-wallD+E;
  group.add(wall);
  const tracD=S.tracDepth;
  const tracMat=S.stained&&G.barColor?new THREE.MeshStandardMaterial({color:new THREE.Color(G.barColor),roughness:0.55,metalness:0,wireframe:S.wire,clippingPlanes:clip,clipShadows:true}):stoneMat;
  const trac=solid(tracShapes,tracD,cham,tracMat);
  trac.position.z=-S.setback-tracD;
  group.add(trac);
  const gt=Math.max(8,Math.min(24,tracD*0.12));
  G.lightShapes.forEach((s,i)=>{
    const color=S.stained?((G.lightColors&&G.lightColors[i])||STAIN[i%STAIN.length]):'#9cc4ff';
    const mat=new THREE.MeshPhysicalMaterial({color:new THREE.Color(color),transparent:true,opacity:S.glassOp,roughness:0.15,metalness:0,side:THREE.DoubleSide,depthWrite:false,wireframe:S.wire,clippingPlanes:clip});
    const geo=new THREE.ExtrudeGeometry([polyShape(s.outer,s.holes)],{depth:gt,bevelEnabled:false,curveSegments:1,steps:1});
    const m=new THREE.Mesh(geo,mat);
    m.position.z=-S.setback-tracD/2-gt/2-E;
    m.receiveShadow=true;
    m.renderOrder=2;
    group.add(m);
  });
  if(S.edges&&!S.wire){
    const lm=new THREE.LineBasicMaterial({color:0x1b1830,transparent:true,opacity:0.45,clippingPlanes:clip});
    const loops=(paths,z)=>{
      paths.forEach(pa=>{
        const pts=pa.map(q=>new THREE.Vector3(q.X/SC,q.Y/SC,z));
        const l=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),lm);
        l.userData.sharedMat=true;
        group.add(l);
      });
    };
    const wb=Math.min(S.chamfer,wallD/2.5),tb=Math.min(cham,tracD/2.5);
    loops(G.surround,E-wb+0.5);
    loops(G.tracery,-S.setback-tb+0.5);
  }
  if(S.secOn){
    const lineMat=new THREE.LineBasicMaterial({color:0x14121f});
    const gz0=-S.setback-tracD/2-gt/2-E;
    const layers=[
      [G.surround,-wallD+E,E,Math.min(S.chamfer,wallD/2.5),'#d9a441'],
      [G.tracery,-S.setback-tracD,-S.setback,cham,'#d9a441'],
      [G.lights,gz0,gz0+gt,0,'#8ec1ff']
    ];
    layers.forEach(L=>{
      sectionIntervals(L[0],cutX).forEach(iv=>{
        capMesh(iv[0],iv[1],L[1],L[2],L[3],L[4],cutX,lineMat).forEach(o=>{o.userData.sharedMat=false;group.add(o);});
      });
    });
  }
  updateSun();
  if(needCam){setView('obl');needCam=false;}
}

function updateSun(){
  if(!sun||!G)return;
  const az=S.sunAz*Math.PI/180,el=S.sunEl*Math.PI/180;
  const cy=G.Ht/2;
  const d=7000;
  sun.position.set(Math.sin(az)*Math.cos(el)*d,cy+Math.sin(el)*d,Math.cos(az)*Math.cos(el)*d);
  sun.target.position.set(0,cy,-200);
  sun.target.updateMatrixWorld();
  const ext=Math.max(G.rect.x1-G.rect.x0,G.Ht+2*S.margin)*0.9;
  const sc=sun.shadow.camera;
  sc.left=-ext;sc.right=ext;sc.top=ext;sc.bottom=-ext;sc.near=100;sc.far=16000;
  sc.updateProjectionMatrix();
}

function resetView3d(){
  S.secOn=false;
  S.secX=0;
  S.explode=0;
  S.wire=false;
  syncControls();
  saveState();
  schedule(false);
  setView('obl');
  toast('3D view reset');
}

function setView(name){
  if(!camera||!G)return;
  const cy=G.Ht/2;
  const W=G.rect.x1-G.rect.x0;
  const tz=-(S.wallDepth)/2;
  const half=Math.tan(camera.fov*Math.PI/360);
  const D=Math.max(G.Ht*1.45,W*1.45/camera.aspect)/(2*half);
  const tx=name==='side'?secCut():0;
  controls.target.set(tx,cy,tz);
  if(name==='front')camera.position.set(0,cy,D);
  else if(name==='side')camera.position.set(tx+Math.max(D,W*2),cy,tz);
  else camera.position.set(D*0.45,cy+G.Ht*0.12,D*0.9);
  camera.updateProjectionMatrix();
  controls.update();
}

function init3D(){
  try{
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  }catch(e){
    renderer=null;
  }
  if(!renderer){
    stage3d.innerHTML='<div class="nogl">WebGL is not available in this browser.</div>';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.localClippingEnabled=true;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x000000,0);
  stage3d.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(35,1,20,200000);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;
  controls.dampingFactor=0.12;
  hemi=new THREE.HemisphereLight(0xe9eaff,0x3a3550,0.75);
  scene.add(hemi);
  sun=new THREE.DirectionalLight(0xfff1dc,0.95);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.bias=-0.0004;
  scene.add(sun);
  scene.add(sun.target);
  group=new THREE.Group();
  scene.add(group);
  resize3D();
}

function resize3D(){
  if(!renderer)return;
  const w=stage3d.clientWidth,h=stage3d.clientHeight;
  if(!w||!h)return;
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}

function loop(){
  requestAnimationFrame(loop);
  if(blocked)return;
  if(dirty2d)draw2D();
  if(controls)controls.update();
  if(renderer)renderer.render(scene,camera);
}

function refresh(){
  rafPending=false;
  if(dirtyGeo){
    dirtyGeo=false;
    try{
      G=compute(S);
    }catch(err){
      toast('Geometry error — adjust parameters');
      return;
    }
    dirty3d=true;dirty2d=true;
    document.getElementById('analysis').innerHTML=analysisHtml();
  }
  if(dirty3d)build3D();
  if(dirty2d&&!blocked)draw2D();
}
function schedule(geo){
  if(geo)dirtyGeo=true;
  dirty3d=true;
  dirty2d=true;
  if(!rafPending){rafPending=true;requestAnimationFrame(refresh);}
}


function diffs(a){
  const o=[];
  for(let i=1;i<a.length;i++)o.push(a[i]-a[i-1]);
  return o;
}

const HELP_START=`
<h2>What TRACERY does</h2>
<p>TRACERY draws the geometry behind architectural windows, from Romanesque and Gothic tracery to Islamic lattice screens, Art Nouveau curves, Mondrian compositions and Le Corbusier's Modulor grids. The left view shows the flat construction, with the circles and centres a mason would have used to set the shapes out. The right view stands the same shapes up in 3D, with stone, tracery and glass as separate layers.</p>
<p>Every control changes both views at once, and the strip at the bottom reports the numbers that define what you see.</p>
<h2>Quick start</h2>
<ol>
<li>Open <b>Presets</b> in the top bar and pick one, for example <i>Geometric Gothic — two lights + sexfoil</i>.</li>
<li>In the left panel, change the <b>Head</b> (the shape of the top of the opening) and watch the construction circles move.</li>
<li>Change the <b>Pattern</b> under Tracery to fill the opening differently.</li>
<li>Adjust <b>Bar width</b> to make the stone heavier or lighter.</li>
<li>Drag in the 3D view to orbit. Use <b>Explode layers</b> to pull the wall, tracery and glass apart.</li>
<li>Press <b>Shuffle</b> for a new variation and <b>Back</b> to undo it.</li>
<li>Use <b>Export</b> to save the window as SVG or DXF.</li>
</ol>
<h2>Six things to try</h2>
<ul>
<li><b>Lancet to drop.</b> Head: Pointed. Drag <i>Radius ÷ span</i> from 0.5 (round) through 1.0 (equilateral) to 2.0 (tall lancet).</li>
<li><b>Fit circles into a gap.</b> Pattern: Geometric. Raise <i>Packed circles</i> and watch each one grow until it touches its neighbours.</li>
<li><b>Count the petals.</b> Head: Circular, Pattern: Rose. Move <i>Petals</i> from 6 to 16 and see the petal radius shrink.</li>
<li><b>Cut through it.</b> Press Section in the 3D pane to see the wall, tracery and glass in profile.</li>
<li><b>Light and shadow.</b> In 3D form, move <i>Sun azimuth</i> and <i>Sun elevation</i> and watch the tracery shade the glass.</li>
<li><b>Let it surprise you.</b> Press <i>Shuffle all</i> a few times. Anything you like can be refined by hand, and Back returns to what you had.</li>
</ul>
<h2>Three reading levels</h2>
<p>The <b>How the math works</b> tab explains each result at three levels. <b>Student</b> uses everyday language and pictures. <b>Designer</b> adds the vocabulary and controls you would use in practice. <b>Professional</b> gives the equations, tolerances and algorithms. Every topic ends with a box that plugs your current window into the formulas.</p>
<p>The small <b>?</b> buttons beside each control group jump straight to the relevant topic.</p>`;
